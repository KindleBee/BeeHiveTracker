}

function toggleTpl(id) { editTpl = editTpl === id ? null : id; openTemplates(); }
function renameTpl(id, v) {
  const t = S.templates.find(x => x.id === id);
  if (t && v.trim()) { t.name = v.trim(); save(); openTemplates(); }
}
function renameEx(id, i, v) {
  const t = S.templates.find(x => x.id === id);
  if (!t) return;
  if (v.trim()) t.exercises[i] = v.trim(); else t.exercises.splice(i,1);
  save(); openTemplates();
}
function removeEx(id, i) {
  const t = S.templates.find(x => x.id === id);
  if (!t) return;
  t.exercises.splice(i,1); save(); openTemplates();
}
function moveEx(id, i, d) {
  const t = S.templates.find(x => x.id === id);
  if (!t) return;
  const j = i + d;
  if (j < 0 || j >= t.exercises.length) return;
  [t.exercises[i], t.exercises[j]] = [t.exercises[j], t.exercises[i]];
  save(); openTemplates();
}
function addTplEx(id) {
  const n = prompt('Exercise name');
  if (!n || !n.trim()) return;
  const t = S.templates.find(x => x.id === id);
  if (t) { t.exercises.push(n.trim()); save(); openTemplates(); }
}
function saveBW(v) {
  S.bodyweight = v === '' ? null : +v;
  save();
  toast(S.bodyweight ? `Bodyweight ${S.bodyweight} kg` : 'Bodyweight cleared');
}
function resetTemplates() {
  if (!confirm('Replace your templates with the Push / Pull / Legs defaults?')) return;
  S.templates = defaultTemplates();
  editTpl = null;
  save(); openTemplates(); toast('Templates restored');
}
function addTemplate() {
  const n = document.getElementById('tplName').value.trim();
  const ex = document.getElementById('tplEx').value.split(',').map(s=>s.trim()).filter(Boolean);
  if (!n || !ex.length) { toast('Name and exercises needed'); return; }
  S.templates.push({ id: 't' + Date.now(), name: n, exercises: ex });
  save(); openTemplates(); toast('Template added');
}
function delTemplate(id) {
  if (!confirm('Delete this template?')) return;
  S.templates = S.templates.filter(t => t.id !== id);
  save(); openTemplates();
}

/* ══════════════════════════════════════════════════════
   HISTORY
   ══════════════════════════════════════════════════════ */
let openWk = null, editWk = null;

function renderPast() {
  const wks = [];
  let d = keyToDate(START_WK);
  while (wkKey(d) < NOW_WK) { wks.push(wkKey(d)); d.setDate(d.getDate() + 7); }
  wks.reverse();

  document.getElementById('pastSub').textContent = `${wks.length} completed ${wks.length === 1 ? 'week' : 'weeks'}`;
  const c = document.getElementById('pastList');

  if (!wks.length) {
    c.innerHTML = `<div class="empty"><div class="empty-ic">🐝</div>
      <p>No finished weeks yet.<br>Your first one lands here on Monday.</p></div>`;
    return;
  }

  c.innerHTML = '<div class="tl" id="tl"></div>';
  const tl = document.getElementById('tl');
  wks.forEach(wk => tl.appendChild(weekCard(wk)));
}

function weekCard(wk) {
  const ws = keyToDate(wk);
  const open = openWk === wk;
  const hol = awayDays(wk);

  let f=0, m=0, x=0, p=0, done=0, target=0;
  GOALS.filter(isScored).forEach(g => {
    const a = ach(wk, g.id);
    if (a==='fail') f++; else if (a==='met') m++; else if (a==='exceed') x++; else if (a==='paused') p++;
    const mn = getMin(wk, g.id);
    if (mn > 0) { done += Math.min(days(wk,g.id), mn); target += mn; }
  });
  const score = target ? Math.round(done / target * 100) : 0;
  const col = score >= 100 ? 'var(--star)' : score >= 75 ? 'var(--green)' : score >= 45 ? 'var(--honey)' : 'var(--red)';

  const el = document.createElement('div');
  el.className = 'pw' + (open ? ' open' : '') + (hol ? ' hol' : '');
  el.innerHTML = `
    <div class="pw-h" onclick="toggleWk('${wk}')">
      <div class="pw-info">
        <div class="pw-num">Week ${wkNum(ws)}</div>
        <div class="pw-dates">${fmtRange(ws)} ${hol ? `<span class="hol-tag">✈ ${hol}d away</span>` : ''}</div>
      </div>
      <div>
        <div class="pw-score" style="color:${col}">${score}%</div>
        <div class="pw-slbl">score</div>
      </div>
      <div class="pw-badges">
        ${x?`<span class="ach-badge ach-exceed">⭐${x}</span>`:''}
        ${m?`<span class="ach-badge ach-met">✓${m}</span>`:''}
        ${p?`<span class="ach-badge ach-paused">⏸${p}</span>`:''}
        ${f?`<span class="ach-badge ach-fail">✕${f}</span>`:''}
      </div>
      <span class="pw-chev">▼</span>
    </div>
    <div class="pw-bar"><div class="pw-bar-f" style="width:${Math.min(score,100)}%;background:${col}"></div></div>
    <div class="pw-body" id="body_${wk}">${open ? weekBody(wk, editWk === wk) : ''}</div>`;
  return el;
}

function weekBody(wk, ed) {
  const hol = awayDays(wk);
  let h = `<div class="pw-bar-top">
    <span style="font-size:10.5px;color:var(--muted)">${ed ? 'Tap days to fix logs, adjust targets below' : 'Full week breakdown'}</span>
    <button class="pw-edit ${ed?'on':''}" onclick="toggleEdit('${wk}')">${ed ? '✓ Done' : '✏️ Edit'}</button>
  </div>`;

  if (ed) {
    const aw = awayArr(wk);
    h += `<div class="away-strip" style="margin-bottom:14px">
      <div class="away-label">Days <b>away or at an event</b></div>
      <div class="away-toggles">
        ${[0,1,2,3,4,5,6].map(i => `<button class="away-tog ${aw[i]?'on':''}" onclick="toggleAwayPast('${wk}',${i})">${DAYS[i][0]}</button>`).join('')}
      </div></div>`;
  } else if (hol) {
    h += `<div class="info-box" style="margin-bottom:12px">✈ <b>${hol} day${hol>1?'s':''} away</b> this week — lower numbers here are expected, and streaks were held rather than broken.</div>`;
  }

  CATS.forEach(cat => {
    h += `<div class="pw-cat" style="color:${cat.color}">${cat.icon} ${cat.name}</div>`;
    cat.goals.forEach(g => {
      const a = ach(wk, g.id);
      const [have, goal] = prog(wk, g.id);
      const d = days(wk, g.id);
      const qs = qtySum(wk, g.id);
      const note = getNote(wk, g.id);
      const scored = isScored(g);
      const byQty = g.target === 'quantity';

      let right;
      if (!scored) right = `<b style="color:var(--life)">${fmtQty(qs, g.unit)}</b>`;
      else if (g.type === 'cardio') right = `${ACH_EMOJI[a]} ${have}/${goal} · ${fmtQty(cardioKm(wk),'km')}`;
      else if (g.type === 'detail') right = `${ACH_EMOJI[a]} ${have}/${goal} · ${weekVolume(wk).toLocaleString('en-GB')}kg`;
      else if (byQty) right = `${ACH_EMOJI[a]} ${fmtQty(have,g.unit)}/${fmtQty(goal,g.unit)} · ${d}d`;
      else if (g.type === 'quantity') right = `${ACH_EMOJI[a]} ${have}/${goal} · ${fmtQty(qs,g.unit)}`;
      else right = `${ACH_EMOJI[a]} ${have}/${goal}`;

      h += `<div class="pw-g"><span style="font-size:15px">${g.icon}</span>
        <span class="pw-gn">${g.name}</span><span class="pw-gr">${right}</span></div>`;

      if (g.type === 'cardio') {
        const cd = S.cardio[wk] || {};
        const idxs = Object.keys(cd).map(Number).sort((a,b)=>a-b);
        if (idxs.length) {
          h += `<div style="display:flex;gap:5px;flex-wrap:wrap;padding:2px 0 6px">`;
          idxs.forEach(i => {
            const c = cd[i];
            const lvl = c.level != null ? ` L${c.level}` : '';
            h += `<span class="cardio-tag">${CK(c.kind).icon} ${DAYS[i]} ${c.km}km${lvl}</span>`;
          });
          h += `</div>`;
        }
      }

      if (ed) {
        h += `<div class="dots" style="margin-bottom:8px">${dotRowHTML(g, wk, null, awayArr(wk))}</div>`;
        if (scored) {
          const lbl = byQty ? `${g.unit} target` : 'Days target';
          const fn  = byQty ? 'bumpQty' : 'bumpMin';
          h += `<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0 10px">
            <span style="font-size:10.5px;color:var(--muted)">${lbl}</span>
            <div class="rv-ctrl">
              <button class="rv-btn" onclick="${fn}('${wk}','${g.id}',-1)">−</button>
              <span class="rv-val" id="pm_${wk}_${g.id}">${goal}</span>
              <button class="rv-btn" onclick="${fn}('${wk}','${g.id}',1)">+</button>
            </div></div>`;
        }
      }

      if (note.trim()) h += `<div class="pw-note">${esc(note)}</div>`;
    });
  });

  return h;
}

function toggleWk(wk) {
  openWk = openWk === wk ? null : wk;
  editWk = null;
  renderPast();
}
function toggleEdit(wk) {
  editWk = editWk === wk ? null : wk;
  const b = document.getElementById('body_' + wk);
  if (b) b.innerHTML = weekBody(wk, editWk === wk);
}
function tickPast(wk, id, i) {
  const l = log(wk, id);
  l[i] = l[i] ? 0 : 1;
  save();
  const b = document.getElementById('body_' + wk);
  if (b) b.innerHTML = weekBody(wk, true);
}
function toggleAwayPast(wk, i) {
  const a = awayArr(wk);
  a[i] = a[i] ? 0 : 1;
  save();
  const b = document.getElementById('body_' + wk);
  if (b) b.innerHTML = weekBody(wk, true);
}
function bumpMin(wk, id, d) {
  setMin(wk, id, getMin(wk, id) + d);
  const el = document.getElementById(`pm_${wk}_${id}`);
  if (el) el.textContent = getMin(wk, id);
}
function bumpQty(wk, id, dir) {
  const g = G(id);
  const step = g.unit === 'minutes' ? 15 : g.unit === 'pages' ? 5 : 1;
  setQtyT(wk, id, getQtyT(wk, id) + dir * step);
  const el = document.getElementById(`pm_${wk}_${id}`);
  if (el) el.textContent = getQtyT(wk, id);
}

/* ══════════════════════════════════════════════════════
   OVERVIEW
   ══════════════════════════════════════════════════════ */
let ovTab = 'all';

function renderOver() {
  const q = Math.floor(TODAY.getMonth()/3) + 1, y = TODAY.getFullYear();
  document.getElementById('ovTitle').innerHTML = `Q${q} <span>${y}</span>`;
  document.getElementById('ovSub').textContent = 'Quarterly progress';

  const tabs = [{id:'all',label:'All'}, ...CATS.map(c=>({id:c.id,label:c.name}))];
  const tabsEl = document.getElementById('ovTabs');
  const panels = document.getElementById('ovPanels');
  tabsEl.innerHTML = '';
  panels.innerHTML = '';

  tabs.forEach(t => {
    const b = document.createElement('button');
    b.className = 'ov-tab' + (ovTab === t.id ? ' active' : '');
    b.textContent = t.label;
    b.onclick = () => { ovTab = t.id; renderOver(); };
    tabsEl.appendChild(b);

    const p = document.createElement('div');
    p.className = 'ov-panel' + (ovTab === t.id ? ' active' : '');
    p.innerHTML = quarterPanel(t.id, q, y);
    panels.appendChild(p);
  });
}

function quarterWeeks(q, y) {
  const out = [];
  let d = weekStart(new Date(y, (q-1)*3, 1));
  const end = new Date(y, q*3, 0);
  while (d <= end) {
    const k = wkKey(d);
    if (k >= START_WK) out.push(k);
    d = new Date(d); d.setDate(d.getDate() + 7);
  }
  return out;
}

function quarterPanel(tab, q, y) {
  const wks = quarterWeeks(q, y);
  const past = wks.filter(w => !isFuture(w));
  const cats = tab === 'all' ? CATS : CATS.filter(c => c.id === tab);
  const scoped = cats.flatMap(c => c.goals).filter(isScored);

  let done=0, target=0, exceeded=0, perfect=0, holWeeks=0;
  past.forEach(wk => {
    if (awayDays(wk) > 0) holWeeks++;
    let ok = true, any = false;
    scoped.forEach(g => {
      const [have, goal] = prog(wk, g.id);
      if (goal > 0) {
        any = true; target += goal; done += Math.min(have, goal);
        if (have > goal) exceeded++;
        if (have < goal) ok = false;
      }
    });
    if (any && ok) perfect++;
  });
  const rate = target ? Math.round(done/target*100) : 0;

  let h = `<div class="q-stats">
    <div class="q-stat"><div class="q-sv">${rate}%</div><div class="q-sl">Hit rate</div></div>
    <div class="q-stat"><div class="q-sv">${perfect}</div><div class="q-sl">Full weeks</div></div>
    <div class="q-stat"><div class="q-sv">${exceeded}</div><div class="q-sl">Exceeded</div></div>
    <div class="q-stat"><div class="q-sv">${holWeeks}</div><div class="q-sl">Away wks</div></div>
  </div>`;

  cats.forEach(cat => {
    h += `<div class="q-cat"><div class="q-cat-h">
      <span style="font-size:16px">${cat.icon}</span>
      <span class="q-cat-t" style="color:${cat.color}">${cat.name}</span></div>`;

    cat.goals.forEach(g => {
      const scored = isScored(g);
      let f=0,m=0,x=0,p=0,tracked=0;
      past.forEach(wk => {
        const a = ach(wk, g.id);
        if (a==='fail'){f++;tracked++;} else if (a==='met'){m++;tracked++;}
        else if (a==='exceed'){x++;tracked++;} else if (a==='paused'){p++;}
      });
      const pct = tracked ? Math.round((m+x)/tracked*100) : 0;

      // what the goal actually asks for
      let targetLbl;
      if (!scored) targetLbl = 'no target · observed';
      else if (g.target === 'quantity') targetLbl = `${fmtQty(getQtyT(NOW_WK,g.id), g.unit)} / week`;
      else targetLbl = `${getMin(NOW_WK,g.id)} ${getMin(NOW_WK,g.id)===1?'day':'days'} / week`;

      // what was actually logged across the quarter
      const totalOf = wk =>
        g.type === 'detail' ? weekVolume(wk) :
        g.type === 'cardio' ? cardioKm(wk) :
        (g.type === 'quantity' || g.type === 'hours') ? qtySum(wk, g.id) : days(wk, g.id);

      const tot = past.reduce((s,wk) => s + totalOf(wk), 0);
      const avg = past.length ? tot/past.length : 0;
      let totalLbl;
      if (g.type === 'detail') totalLbl = `${Math.round(tot).toLocaleString('en-GB')} kg · ${Math.round(avg).toLocaleString('en-GB')}/wk`;
      else if (g.type === 'tick') totalLbl = `${tot} days · ${Math.round(avg*10)/10}/wk`;
      else totalLbl = `${fmtQty(tot,g.unit)} · ${fmtQty(avg,g.unit)}/wk`;

      const drill = (g.type === 'detail' || g.type === 'cardio');

      h += `<div class="q-goal${drill?' drill':''}" ${drill?`onclick="openDrill('${g.id}',${q},${y})"`:''}>
        <div class="q-gn">
          <span>${g.icon} ${g.name}${drill?' <span class="q-more">details ›</span>':''}</span>
          <span class="q-gs">${targetLbl}</span>
        </div>`;

      if (scored) {
        h += `<div class="q-grid">`;
        wks.forEach(wk => {
          const fut = isFuture(wk);
          const a = fut ? 'future' : ach(wk, g.id);
          const [have, goal] = prog(wk, g.id);
          const num = g.target === 'quantity' ? `${Math.round(have)}/${Math.round(goal)}` : `${have}/${goal}`;
          let cls = 'q-cell ', inner = '';
          if (fut) cls += 'wk-future';
          else if (a === 'skip') { cls += 'wk-skip'; inner = `<span class="q-sym">—</span>`; }
          else if (a === 'live') { cls += 'wk-skip'; inner = `<span class="q-sym">·</span><span class="q-nm">${num}</span>`; }
          else { cls += 'wk-' + a; inner = `<span class="q-sym">${ACH_ICON[a]}</span><span class="q-nm">${num}</span>`; }
          h += `<div class="${cls}" title="W${wkNum(keyToDate(wk))}: ${num}">${inner}</div>`;
        });
        h += `</div><div class="q-tally">
          <span style="color:var(--star)">★ ${x}</span>
          <span style="color:var(--green)">✓ ${m}</span>
          <span style="color:var(--red)">✕ ${f}</span>
          ${p?`<span style="color:var(--away)">⏸ ${p}</span>`:''}
          <span style="margin-left:auto">${pct}% of weeks</span>
        </div>`;
      }

      // amount logged per week
      if (g.type !== 'tick') {
        const vals = wks.map(wk => isFuture(wk) ? null : totalOf(wk));
        const max = Math.max(...vals.filter(v => v !== null), 1);
        h += `<div class="spark-wrap">
          <div class="spark">${vals.map(v =>
            v === null
              ? `<div class="spark-b" style="height:2px;background:var(--border);opacity:0.3"></div>`
              : `<div class="spark-b" title="${fmtQty(v,g.unit)}" style="height:${Math.max(2, v/max*30)}px;background:${v>0?cat.color:'var(--border)'};opacity:${v>0?0.8:1}"></div>`
          ).join('')}</div>
          <div class="spark-lbl"><span>${totalLbl}</span><span>peak ${fmtQty(max, g.unit)}</span></div>
        </div>`;
      } else {
        h += `<div class="spark-lbl" style="margin-top:5px"><span>${totalLbl}</span></div>`;
      }

      h += `</div>`;
    });
    h += `</div>`;
  });

  if (!past.length) h += `<div class="empty"><div class="empty-ic">🔭</div><p>Nothing to show yet — this fills in as weeks complete.</p></div>`;

  return h;
}

/* ══════════════════════════════════════════════════════
   DRILL-DOWN — strength and cardio quarter detail
   ══════════════════════════════════════════════════════ */
function openDrill(id, q, y) {
  if (id === 'strength') drillStrength(q, y);
  else if (id === 'cardio') drillCardio(q, y);
}

/* Collect every logged set in the quarter, grouped by exercise */
function exerciseHistory(q, y) {
  const wks = quarterWeeks(q, y).filter(w => !isFuture(w));
  const byEx = {};
  wks.forEach(wk => {
    const dd = S.sessions[wk] || {};
    Object.keys(dd).map(Number).sort((a,b)=>a-b).forEach(i => {
      const ws = keyToDate(wk);
      const d = new Date(ws); d.setDate(d.getDate() + i);
      dd[i].forEach(ex => {
        const sets = ex.sets.filter(s => s.reps || s.kg);
        if (!sets.length) return;
        byEx[ex.name] = byEx[ex.name] || [];
        // top set = heaviest resolved weight, tie broken by reps
        let top = null;
        sets.forEach(s => {
          const kg = parseKg(s.kg), r = parseReps(s.reps);
          if (r.isTime) return;
          if (!top || kg > top.kg || (kg === top.kg && r.n > top.reps)) top = { kg, reps: r.n, raw: s };
        });
        byEx[ex.name].push({
          wk, date: d, day: i,
          sets: sets.map(s => ({ ...s })),
          volume: Math.round(sets.reduce((t,s) => t + setVolume(s), 0)),
          top
        });
      });
    });
  });
  Object.keys(byEx).forEach(k => byEx[k].sort((a,b) => a.date - b.date));
  return byEx;
}

function drillStrength(q, y) {
  const wks = quarterWeeks(q, y);
  const past = wks.filter(w => !isFuture(w));
  const byEx = exerciseHistory(q, y);
  const names = Object.keys(byEx).sort((a,b) => byEx[b].length - byEx[a].length);

  const totalVol = past.reduce((s,wk) => s + weekVolume(wk), 0);
  const totalSessions = past.reduce((s,wk) => s + Object.keys(S.sessions[wk] || {}).filter(i => (S.sessions[wk][i]||[]).length).length, 0);
  const totalSets = names.reduce((s,n) => s + byEx[n].reduce((t,e) => t + e.sets.length, 0), 0);

  let h = `<div class="modal-title">🏋️ <span>Strength</span> · Q${q} ${y}</div>
    <div class="modal-sub">Every session and set this quarter</div>
    <div class="q-stats" style="margin-bottom:18px">
      <div class="q-stat"><div class="q-sv">${totalSessions}</div><div class="q-sl">Sessions</div></div>
      <div class="q-stat"><div class="q-sv">${totalSets}</div><div class="q-sl">Sets</div></div>
      <div class="q-stat"><div class="q-sv">${Math.round(totalVol/1000)}t</div><div class="q-sl">Volume</div></div>
      <div class="q-stat"><div class="q-sv">${names.length}</div><div class="q-sl">Lifts</div></div>
    </div>`;

  // weekly volume bars
  const vols = wks.map(wk => isFuture(wk) ? null : weekVolume(wk));
  const vmax = Math.max(...vols.filter(v => v !== null), 1);
  h += `<div class="drill-sec">Weekly volume</div>
    <div class="spark" style="height:44px">${vols.map((v,i) =>
      v === null
        ? `<div class="spark-b" style="height:2px;background:var(--border);opacity:0.3"></div>`
        : `<div class="spark-b" title="W${wkNum(keyToDate(wks[i]))}: ${v.toLocaleString('en-GB')}kg"
             style="height:${Math.max(2, v/vmax*40)}px;background:var(--health);opacity:${v>0?0.8:1}"></div>`
    ).join('')}</div>
    <div class="spark-lbl"><span>W${wkNum(keyToDate(wks[0]))}</span><span>peak ${vmax.toLocaleString('en-GB')} kg</span></div>`;

  if (!names.length) {
    h += `<div class="empty" style="padding:30px 10px"><div class="empty-ic">🏋️</div>
      <p>No sets logged this quarter yet.</p></div>`;
  }

  names.forEach(name => {
    const hist = byEx[name];
    const tops = hist.filter(e => e.top).map(e => e.top.kg);
    const best = tops.length ? Math.max(...tops) : 0;
    const first = tops.length ? tops[0] : 0;
    const latest = tops.length ? tops[tops.length-1] : 0;
    const delta = latest - first;
    const totalV = hist.reduce((s,e) => s + e.volume, 0);

    h += `<div class="drill-ex">
      <div class="drill-ex-h">
        <div style="flex:1;min-width:0">
          <div class="drill-ex-n">${esc(name)}</div>
          <div class="drill-ex-m">${hist.length} sessions · ${totalV.toLocaleString('en-GB')} kg</div>
        </div>
        <div style="text-align:right">
          <div class="drill-best">${best ? best + ' kg' : '—'}</div>
          <div class="drill-ex-m">${delta > 0 ? `<span style="color:var(--green)">▲ ${Math.round(delta*10)/10}</span>` : delta < 0 ? `<span style="color:var(--red)">▼ ${Math.abs(Math.round(delta*10)/10)}</span>` : 'best'}</div>
        </div>
      </div>`;

    // top-set progression line
    if (tops.length > 1) {
      const mn = Math.min(...tops), mx = Math.max(...tops);
      const span = mx - mn || 1;
      const pts = tops.map((v,i) => `${(i/(tops.length-1))*100},${28 - ((v-mn)/span)*26}`).join(' ');
      h += `<svg class="drill-line" viewBox="0 0 100 30" preserveAspectRatio="none">
        <polyline points="${pts}" fill="none" stroke="var(--health)" stroke-width="1.4"
          vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
        ${tops.map((v,i) => `<circle cx="${(i/(tops.length-1))*100}" cy="${28 - ((v-mn)/span)*26}" r="1.6" fill="var(--health)"/>`).join('')}
      </svg>`;
    }

    // session rows
    hist.slice().reverse().forEach(e => {
      const setStr = e.sets.map(s => `${s.reps ?? '?'}×${s.kg ?? '?'}`).join('  ');
      h += `<div class="drill-row">
        <span class="drill-date">W${wkNum(e.date)} ${DAYS[e.day]}</span>
        <span class="drill-sets">${esc(setStr)}</span>
        <span class="drill-vol">${e.volume ? e.volume.toLocaleString('en-GB') : ''}</span>
      </div>`;
    });

    h += `</div>`;
  });

  h += `<div class="btn-row"><button class="btn-ghost" style="flex:1" onclick="closeModal()">Close</button></div>`;
  openModal(h);
}

function drillCardio(q, y) {
  const wks = quarterWeeks(q, y);
  const past = wks.filter(w => !isFuture(w));

  // gather sessions
  const all = [];
  past.forEach(wk => {
    const cd = S.cardio[wk] || {};
    Object.keys(cd).map(Number).sort((a,b)=>a-b).forEach(i => {
      const ws = keyToDate(wk);
      const d = new Date(ws); d.setDate(d.getDate() + i);
      all.push({ ...cd[i], wk, day: i, date: d });
    });
  });
  all.sort((a,b) => a.date - b.date);

  const totalKm = +all.reduce((s,e) => s + (+e.km||0), 0).toFixed(1);
  const byKind = {};
  all.forEach(e => {
    byKind[e.kind] = byKind[e.kind] || { km:0, n:0, levels:[] };
    byKind[e.kind].km += +e.km || 0;
    byKind[e.kind].n++;
    if (e.level != null) byKind[e.kind].levels.push({ level: e.level, date: e.date, km: +e.km||0 });
  });
  const kinds = CARDIO_KINDS.filter(k => byKind[k.id]);
  const longest = all.length ? Math.max(...all.map(e => +e.km||0)) : 0;

  let h = `<div class="modal-title">🏃 <span>Cardio</span> · Q${q} ${y}</div>
    <div class="modal-sub">Every session this quarter</div>
    <div class="q-stats" style="margin-bottom:18px">
      <div class="q-stat"><div class="q-sv">${all.length}</div><div class="q-sl">Sessions</div></div>
      <div class="q-stat"><div class="q-sv">${totalKm}</div><div class="q-sl">Total km</div></div>
      <div class="q-stat"><div class="q-sv">${longest}</div><div class="q-sl">Longest</div></div>
      <div class="q-stat"><div class="q-sv">${kinds.length}</div><div class="q-sl">Types</div></div>
    </div>`;

  // weekly km bars
  const kms = wks.map(wk => isFuture(wk) ? null : cardioKm(wk));
  const kmax = Math.max(...kms.filter(v => v !== null), 1);
  h += `<div class="drill-sec">Weekly distance</div>
    <div class="spark" style="height:44px">${kms.map((v,i) =>
      v === null
        ? `<div class="spark-b" style="height:2px;background:var(--border);opacity:0.3"></div>`
        : `<div class="spark-b" title="W${wkNum(keyToDate(wks[i]))}: ${v}km"
             style="height:${Math.max(2, v/kmax*40)}px;background:var(--health);opacity:${v>0?0.8:1}"></div>`
    ).join('')}</div>
    <div class="spark-lbl"><span>W${wkNum(keyToDate(wks[0]))}</span><span>peak ${kmax} km</span></div>`;

  if (!all.length) {
    h += `<div class="empty" style="padding:30px 10px"><div class="empty-ic">🏃</div>
      <p>No cardio logged this quarter yet.</p></div>`;
  }

  // split by kind
  h += kinds.length ? `<div class="drill-sec" style="margin-top:20px">By type</div>` : '';
  kinds.forEach(k => {
    const b = byKind[k.id];
    const pctShare = totalKm ? Math.round(b.km/totalKm*100) : 0;
    h += `<div class="drill-kind">
      <div class="drill-kind-h">
        <span style="font-size:16px">${k.icon}</span>
        <span class="drill-ex-n" style="flex:1">${k.name}</span>
        <span class="drill-ex-m">${b.n} × · ${Math.round(b.km*10)/10} km</span>
      </div>
      <div class="prog-bar" style="margin:6px 0 4px"><div class="prog-fill" style="width:${pctShare}%;background:var(--health)"></div></div>
      <div class="drill-ex-m">${pctShare}% of your distance</div>`;

    // level progression
    if (b.levels.length > 1) {
      const lv = b.levels.map(x => x.level);
      const mn = Math.min(...lv), mx = Math.max(...lv);
      const span = mx - mn || 1;
      const pts = lv.map((v,i) => `${(i/(lv.length-1))*100},${28 - ((v-mn)/span)*26}`).join(' ');
      h += `<div class="drill-ex-m" style="margin-top:9px">Level ${mn}${mx!==mn?` → ${mx}`:''}</div>
        <svg class="drill-line" viewBox="0 0 100 30" preserveAspectRatio="none">
          <polyline points="${pts}" fill="none" stroke="var(--honey)" stroke-width="1.4"
            vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
          ${lv.map((v,i) => `<circle cx="${(i/(lv.length-1))*100}" cy="${28 - ((v-mn)/span)*26}" r="1.6" fill="var(--honey)"/>`).join('')}
        </svg>`;
    } else if (b.levels.length === 1) {
      h += `<div class="drill-ex-m" style="margin-top:7px">Level ${b.levels[0].level}</div>`;
    }
    h += `</div>`;
  });

  // session log
  if (all.length) {
    h += `<div class="drill-sec" style="margin-top:20px">Every session</div><div class="drill-ex">`;
    all.slice().reverse().forEach(e => {
      h += `<div class="drill-row">
        <span class="drill-date">W${wkNum(e.date)} ${DAYS[e.day]}</span>
        <span class="drill-sets">${CK(e.kind).icon} ${CK(e.kind).name}${e.level != null ? ` · L${e.level}` : ''}</span>
        <span class="drill-vol">${e.km} km</span>
      </div>`;
    });
    h += `</div>`;
  }

  h += `<div class="btn-row"><button class="btn-ghost" style="flex:1" onclick="closeModal()">Close</button></div>`;
  openModal(h);
}

/* ══════════════════════════════════════════════════════

function renderReview() {
  const c = document.getElementById('reviewBody');
  const wk = NOW_WK;
  const aw = awayArr(wk);

  const prevD = new Date(weekStart(TODAY)); prevD.setDate(prevD.getDate() - 7);
  const prevWk = wkKey(prevD);
  const hasPrev = prevWk >= START_WK;

  c.innerHTML = `<div class="info-box">
    <b>Week ${wkNum(TODAY)}</b> · ${fmtRange(weekStart(TODAY))}<br>
    Tap any day to add something you forgot, or to correct a mistake.
  </div>
  <div class="away-strip" style="margin-bottom:18px">
    <div class="away-label">Days <b>away or at an event</b></div>
    <div class="away-toggles">
      ${[0,1,2,3,4,5,6].map(i => `<button class="away-tog ${aw[i]?'on':''}" onclick="toggleAway(${i});renderReview()">${DAYS[i][0]}</button>`).join('')}
    </div></div>`;

  CATS.forEach(cat => {
    const head = document.createElement('div');
    head.className = 'cat-header';
    head.innerHTML = `<span>${cat.icon}</span><span class="cat-title" style="color:${cat.color};font-size:15px">${cat.name}</span>`;
    c.appendChild(head);

    const card = document.createElement('div');
    card.className = 'rv-card';

    cat.goals.forEach(g => {
      const d = days(wk, g.id);
      const qs = qtySum(wk, g.id);
      const [have, goal] = prog(wk, g.id);
      const a = achLive(wk, g.id);
      const scored = isScored(g);
      const byQty = g.target === 'quantity';

      const headline = (g.type === 'tick' || g.type === 'detail' || g.type === 'cardio')
        ? d : fmtQty(qs, g.unit);

      let status;
      if (!scored) status = `${fmtQty(qs, g.unit)} logged`;
      else if (goal === 0) status = 'no target';
      else if (a === 'exceed') status = `<span style="color:var(--star)">⭐ ${byQty?fmtQty(have,g.unit):have} of ${byQty?fmtQty(goal,g.unit):goal}</span>`;
      else if (a === 'met') status = `<span style="color:var(--green)">✓ ${byQty?fmtQty(have,g.unit):have} of ${byQty?fmtQty(goal,g.unit):goal}</span>`;
      else status = `${byQty?fmtQty(have,g.unit):have} of ${byQty?fmtQty(goal,g.unit):goal}`;

      const row = document.createElement('div');
      row.className = 'rv-g';
      row.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <span style="font-size:13.5px;font-weight:700">${g.icon} ${g.name}</span>
          <span style="font-family:'Playfair Display',serif;font-size:17px;color:var(--honey)">${headline}</span>
        </div>
        <div class="dots" style="margin:8px 0 6px">${dotRowHTML(g, wk, TODAY_I, aw)}</div>
        <div style="font-size:10.5px;color:var(--muted)">${status}</div>`;
      card.appendChild(row);
    });

    c.appendChild(card);
  });

  // Last week, for comparison
  if (hasPrev) {
    const h = document.createElement('div');
    h.style.cssText = 'margin-top:26px';
    let inner = `<div class="ov-sub" style="margin-bottom:12px">Last week · W${wkNum(prevD)}</div>
      <div class="rv-card">`;
    CATS.forEach(cat => {
      cat.goals.filter(isScored).forEach(g => {
        const a = ach(prevWk, g.id);
        const [have, goal] = prog(prevWk, g.id);
        const byQty = g.target === 'quantity';
        const shown = byQty ? `${fmtQty(have,g.unit)}/${fmtQty(goal,g.unit)}` : `${have}/${goal}`;
        inner += `<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:12.5px">${g.icon} ${g.name}</span>
          <span style="font-size:12px;color:var(--muted)">${ACH_EMOJI[a]} ${shown}</span>
        </div>`;
      });
    });
    inner += `</div>`;
    h.innerHTML = inner;
    c.appendChild(h);
  }
}

/* ══════════════════════════════════════════════════════
   EXPORT
   ══════════════════════════════════════════════════════ */
function openExport() {
  openModal(`<div class="modal-title">📊 <span>Export data</span></div>
    <div class="modal-sub">CSV opens straight in Excel</div>
    <div class="info-box">
      <b>Weekly summary</b> gives one row per week per goal — days, target, outcome, quantity.
      <b>Training log</b> gives one row per set. <b>Cardio log</b> gives one row per session with type, minutes and intensity.
    </div>
    <div style="display:flex;flex-direction:column;gap:9px">
      <button class="btn-honey" onclick="exportWeekly()">Weekly summary CSV</button>
      <button class="btn-honey" onclick="exportTraining()">Training log CSV</button>
      <button class="btn-honey" onclick="exportCardio()">Cardio log CSV</button>
    </div>
    <div class="btn-row"><button class="btn-ghost" style="flex:1" onclick="closeModal()">Close</button></div>`);
}

function csvEsc(v) {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function download(name, text) {
  const b = new Blob([text], { type:'text/csv;charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
}

function allWeeks() {
  const out = [];
  let d = keyToDate(START_WK);
  while (wkKey(d) <= NOW_WK) { out.push(wkKey(d)); d.setDate(d.getDate() + 7); }
  return out;
}

function exportWeekly() {
  const rows = [['week_number','week_start','category','goal','type','target_basis','unit','days_done','days_target','quantity','quantity_target','outcome','volume_kg','cardio_km','days_away','note']];
  allWeeks().forEach(wk => {
    const wn = wkNum(keyToDate(wk));
    GOALS.forEach(g => {
      const cat = CATS.find(c => c.id === g.catId);
      rows.push([
        wn, wk, cat.name, g.name, g.type, g.target || 'days', g.unit || '',
        days(wk, g.id), getMin(wk, g.id),
        (g.type==='quantity'||g.type==='hours') ? qtySum(wk,g.id) : '',
        g.target === 'quantity' ? getQtyT(wk,g.id) : '',
        ach(wk, g.id),
        g.type==='detail' ? weekVolume(wk) : '',
        g.type==='cardio' ? cardioKm(wk) : '',
        awayDays(wk), getNote(wk, g.id)
      ]);
    });
  });
  download(`hive_weekly_${new Date().toISOString().slice(0,10)}.csv`,
    rows.map(r => r.map(csvEsc).join(',')).join('\n'));
  toast('Weekly CSV downloaded');
}

function exportCardio() {
  const rows = [['week_number','date','day','type','km','level']];
  Object.keys(S.cardio).sort().forEach(wk => {
    const ws = keyToDate(wk);
    Object.keys(S.cardio[wk]).map(Number).sort((a,b)=>a-b).forEach(i => {
      const c = S.cardio[wk][i];
      const d = new Date(ws); d.setDate(d.getDate() + i);
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      rows.push([wkNum(d), ds, DAYS[i], CK(c.kind).name, c.km, c.level ?? '']);
    });
  });
  if (rows.length === 1) { toast('No cardio logged yet'); return; }
  download(`hive_cardio_${new Date().toISOString().slice(0,10)}.csv`,
    rows.map(r => r.map(csvEsc).join(',')).join('\n'));
  toast('Cardio CSV downloaded');
}

function exportTraining() {
  const rows = [['week_number','date','exercise','set_number','reps_entered','kg_entered','reps_num','kg_resolved','is_hold','volume_kg']];
  Object.keys(S.sessions).sort().forEach(wk => {
    const ws = keyToDate(wk);
    Object.keys(S.sessions[wk]).map(Number).sort((a,b)=>a-b).forEach(i => {
      const d = new Date(ws); d.setDate(d.getDate() + i);
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      S.sessions[wk][i].forEach(ex => {
        ex.sets.forEach((st, si) => {
          const r = parseReps(st.reps);
          rows.push([wkNum(d), ds, ex.name, si+1, st.reps ?? '', st.kg ?? '',
                     r.n, parseKg(st.kg), r.isTime ? 'yes' : 'no', Math.round(setVolume(st))]);
        });
      });
    });
  });
  if (rows.length === 1) { toast('No sessions logged yet'); return; }
  download(`hive_training_${new Date().toISOString().slice(0,10)}.csv`,
    rows.map(r => r.map(csvEsc).join(',')).join('\n'));
  toast('Training CSV downloaded');
}

/* ══════════════════════════════════════════════════════
   SYNC
   ══════════════════════════════════════════════════════ */
function openSync() {
  const last = localStorage.getItem('hive_v2_export');
  openModal(`<div class="modal-title">🔄 <span>Sync &amp; backup</span></div>
    <div class="modal-sub">Move data between phone and laptop</div>
    <div class="info-box">Each device keeps its own copy. Export here, import there.</div>
    <button class="btn-honey" style="width:100%" onclick="exportJSON()">Download backup</button>
    <label style="margin-top:20px">Restore from a backup</label>
    <label for="impFile" style="display:flex;align-items:center;justify-content:center;gap:9px;
      padding:14px;border-radius:12px;border:1.5px dashed var(--border);cursor:pointer;
      font-size:13px;color:var(--muted);font-weight:700;letter-spacing:0;text-transform:none;margin:0">
      📂 Choose backup file
      <input type="file" id="impFile" accept=".json" style="display:none" onchange="importJSON(event)">
    </label>
    <p style="font-size:10.5px;color:var(--muted);margin-top:8px;text-align:center">
      Replaces everything on this device.
    </p>
    <p style="font-size:10.5px;color:var(--muted);margin-top:14px;text-align:center">
      ${last ? 'Last export ' + new Date(last).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : 'No export yet on this device'}
    </p>
    <div class="btn-row"><button class="btn-ghost" style="flex:1" onclick="closeModal()">Close</button></div>`);
}
function exportJSON() {
  const blob = new Blob([JSON.stringify({ v:2, at:new Date().toISOString(), state:S }, null, 2)], {type:'application/json'});
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = `hive_backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
  localStorage.setItem('hive_v2_export', new Date().toISOString());
  toast('Backup downloaded');
}
function importJSON(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const p = JSON.parse(ev.target.result);
      if (!p.state || !p.state.logs) { toast('That file is not a Hive backup'); return; }
      const n = Object.keys(p.state.logs).length;
      if (!confirm(`Restore ${n} weeks from ${p.at ? new Date(p.at).toLocaleDateString('en-GB') : 'unknown date'}?\n\nThis replaces everything on this device.`)) {
        e.target.value = ''; return;
      }
      S = { ...blank(), ...p.state };
      save(); closeModal(); refresh();
      toast(`${n} weeks restored`);
    } catch (err) { toast('Could not read that file'); }
    e.target.value = '';
  };
  r.readAsText(f);
}

/* ══════════════════════════════════════════════════════
   NAV / MENU / TOAST
   ══════════════════════════════════════════════════════ */
let view = 'week';
function go(name, btn) {
  closeMenu();
  view = name;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('v-' + name).classList.add('active');
  btn.classList.add('active');
  window.scrollTo({ top: 0 });
  refresh();
}
function refresh() {
  if (view === 'week') renderWeek();
  else if (view === 'past') renderPast();
  else if (view === 'over') renderOver();
  else if (view === 'review') renderReview();
  else renderWeek();
}

let menuOpen = false;
function toggleMenu(btn) {
  const m = document.getElementById('menu');
  menuOpen = !menuOpen;
  m.style.display = menuOpen ? 'block' : 'none';
  if (menuOpen) setTimeout(() => document.addEventListener('click', outside), 10);
  else document.removeEventListener('click', outside);
}
function closeMenu() {
  menuOpen = false;
  document.getElementById('menu').style.display = 'none';
  document.removeEventListener('click', outside);
}
function outside(e) {
  const m = document.getElementById('menu');
  const b = document.querySelector('.bnav-btn:last-child');
  if (!m.contains(e.target) && !b.contains(e.target)) closeMenu();
}

let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ══ INIT ══ */
renderWeek();
</script>
