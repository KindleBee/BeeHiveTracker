<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hive — Life Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #17130a;
  --bg2:      #1e1809;
  --surface:  #272010;
  --surface2: #322913;
  --border:   #473a1b;
  --border2:  #5c4a22;
  --honey:    #f5a623;
  --gold:     #f0c040;
  --cream:    #f5e6c0;
  --muted:    #8a7548;
  --text:     #f0e0b0;
  --green:    #6dbf7c;
  --red:      #e05555;
  --star:     #f5c842;
  --health:   #e8a040;
  --learning: #60b8e8;
  --life:     #b083e0;
  --away:     #4fb3c9;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  padding-bottom: 92px;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(ellipse at 15% 10%, rgba(245,166,35,0.07) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 90%, rgba(176,131,224,0.04) 0%, transparent 55%);
  pointer-events: none; z-index: 0;
}

button { font-family: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--honey); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ══ HEADER ══ */
header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, var(--bg) 78%, transparent);
  padding: 18px 18px 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.logo { display: flex; align-items: center; gap: 9px; }
.logo-text { font-family: 'Playfair Display', serif; font-size: 21px; color: var(--honey); line-height: 1; }
.logo-text span {
  font-size: 9px; display: block; color: var(--muted);
  font-family: 'Nunito', sans-serif; font-weight: 600;
  letter-spacing: 2.4px; text-transform: uppercase; margin-top: 3px;
}
.week-pill {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 6px 12px; text-align: right; flex-shrink: 0;
}
.week-pill b { color: var(--honey); display: block; font-size: 14px; font-weight: 800; line-height: 1.1; }
.week-pill span { font-size: 9.5px; color: var(--muted); letter-spacing: 0.3px; }

/* ══ VIEWS ══ */
.view { display: none; padding: 14px 16px 0; position: relative; z-index: 1; }
.view.active { display: block; }

/* ══ DAY STRIP ══ */
.day-row { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 8px; }
.day-cell {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: 6px 2px; text-align: center;
}
.day-cell.today { border-color: var(--honey); background: rgba(245,166,35,0.07); }
.day-cell.away { border-color: var(--away); background: rgba(79,179,201,0.09); }
.day-cell .dn { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; }
.day-cell .dd { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--text); margin-top: 1px; }
.day-cell.today .dd { color: var(--honey); }

/* away strip */
.away-strip {
  display: grid; grid-template-columns: 1fr auto; gap: 8px;
  align-items: center; margin-bottom: 18px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 11px; padding: 8px 10px;
}
.away-label { font-size: 10px; color: var(--muted); letter-spacing: 0.4px; line-height: 1.35; }
.away-label b { color: var(--away); font-weight: 700; }
.away-toggles { display: flex; gap: 3px; }
.away-tog {
  width: 26px; height: 26px; border-radius: 7px;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); font-size: 9px; font-weight: 700; cursor: pointer;
  transition: all 0.15s;
}
.away-tog.on { background: rgba(79,179,201,0.2); border-color: var(--away); color: var(--away); }

/* ══ CATEGORY ══ */
.cat-section { margin-bottom: 22px; }
.cat-header {
  display: flex; align-items: center; gap: 9px;
  margin-bottom: 11px; padding-bottom: 7px;
  border-bottom: 1px solid var(--border);
}
.cat-title { font-family: 'Playfair Display', serif; font-size: 17px; flex: 1; }
.streak-pill {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(245,200,66,0.1); border: 1px solid rgba(245,200,66,0.28);
  border-radius: 11px; padding: 2px 9px; font-size: 10px; color: var(--star); font-weight: 700;
}
.streak-pill.paused { background: rgba(79,179,201,0.1); border-color: rgba(79,179,201,0.28); color: var(--away); }

/* ══ GOAL CARD ══ */
.goal-card {
  background: var(--surface); border: 1px solid var(--border);
  border-left-width: 3px; border-radius: 13px;
  padding: 13px; margin-bottom: 9px;
}
.goal-card.unscored { border-left-color: var(--muted) !important; opacity: 0.94; }
.goal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
.goal-left { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; }
.goal-icon { font-size: 19px; flex-shrink: 0; }
.goal-name { font-size: 14.5px; font-weight: 700; line-height: 1.2; }
.goal-sub { font-size: 9.5px; color: var(--muted); margin-top: 2px; letter-spacing: 0.2px; }
.goal-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.goal-count { font-family: 'Playfair Display', serif; font-size: 19px; color: var(--honey); min-width: 20px; text-align: right; }
.icon-btn {
  background: none; border: none; cursor: pointer;
  font-size: 14px; padding: 4px 5px; border-radius: 6px;
  color: var(--muted); transition: all 0.15s;
}
.icon-btn.active { color: var(--honey); }

.ach-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 9.5px; padding: 2px 7px; border-radius: 10px;
  font-weight: 700; letter-spacing: 0.2px; white-space: nowrap;
}
.ach-fail   { background: rgba(224,85,85,0.16);  color: var(--red);   border: 1px solid rgba(224,85,85,0.3); }
.ach-met    { background: rgba(109,191,124,0.16); color: var(--green); border: 1px solid rgba(109,191,124,0.3); }
.ach-exceed { background: rgba(245,200,66,0.16);  color: var(--star);  border: 1px solid rgba(245,200,66,0.3); }
.ach-skip   { background: rgba(138,117,72,0.12);  color: var(--muted); border: 1px solid var(--border); }
.ach-paused { background: rgba(79,179,201,0.14);  color: var(--away);  border: 1px solid rgba(79,179,201,0.3); }

/* ══ DAY DOTS ══ */
.dots { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 9px; }
.dot-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.dot-lbl { font-size: 7px; color: var(--muted); letter-spacing: 0.4px; font-weight: 700; }
.dot {
  width: 100%; aspect-ratio: 1;
  border-radius: 7px; border: 1.5px solid var(--border);
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.12s, border-color 0.15s, background 0.15s;
  font-size: 10px; font-weight: 800; color: var(--muted);
}
.dot .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all 0.18s; }
.dot.done { border-color: rgba(109,191,124,0.5); background: rgba(109,191,124,0.1); }
.dot.done .pip { background: var(--green); box-shadow: 0 0 7px rgba(109,191,124,0.45); }
.dot.qty { color: var(--green); }
.dot.qty.has { border-color: rgba(109,191,124,0.5); background: rgba(109,191,124,0.1); }
.dot.hours.has { border-color: rgba(176,131,224,0.5); background: rgba(176,131,224,0.12); color: var(--life); }
.dot.today-d { border-color: var(--honey); }
.dot.away-d { border-style: dashed; border-color: var(--away); }
.dot.future { opacity: 0.28; cursor: default; }
.dot:active:not(.future) { transform: scale(0.88); }

/* ══ PROGRESS ══ */
.prog-row { display: flex; align-items: center; gap: 8px; }
.prog-bar { flex: 1; height: 4px; background: var(--border); border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 3px; transition: width 0.45s cubic-bezier(0.34,1.5,0.64,1); }
.prog-lbl { font-size: 9.5px; color: var(--muted); white-space: nowrap; font-weight: 600; }

.qty-line {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--border);
  font-size: 10px; color: var(--muted);
}
.qty-line b { color: var(--text); font-weight: 700; }
.qty-line .hit { color: var(--green); }

/* ══ QUANTITY PICKER ══ */
.qp-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.82); z-index: 320;
  align-items: flex-end; justify-content: center;
}
.qp-overlay.open { display: flex; }
.qp {
  background: var(--bg2); border: 1px solid var(--border);
  border-top: 2px solid var(--honey);
  border-radius: 20px 20px 0 0; padding: 8px 0 30px;
  width: 100%; max-width: 500px;
  animation: rise 0.24s cubic-bezier(0.34,1.5,0.64,1);
}
@keyframes rise { from { transform: translateY(36px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
.grip { width: 38px; height: 4px; background: var(--border2); border-radius: 3px; margin: 0 auto 16px; }
.qp-body { padding: 0 18px; }
.qp-title { font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 3px; }
.qp-sub { font-size: 10.5px; color: var(--muted); margin-bottom: 16px; }
.qp-val {
  text-align: center; font-family: 'Playfair Display', serif;
  font-size: 40px; color: var(--honey); line-height: 1; margin-bottom: 3px;
}
.qp-unit { text-align: center; font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
.qp-chips { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
.qp-chip {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-size: 13px; font-weight: 700;
  padding: 9px 15px; border-radius: 20px; cursor: pointer; transition: all 0.15s;
}
.qp-chip:hover, .qp-chip:active { border-color: var(--honey); color: var(--honey); }
.qp-step { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; }
.qp-sbtn {
  width: 44px; height: 44px; border-radius: 13px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.qp-sbtn:active { border-color: var(--honey); color: var(--honey); }

/* ══ BUTTONS ══ */
.btn-honey {
  flex: 1; background: var(--honey); color: #17130a;
  border: none; font-size: 13.5px; font-weight: 800;
  padding: 14px; border-radius: 12px; cursor: pointer; letter-spacing: 0.2px;
}
.btn-honey:active { opacity: 0.85; }
.btn-ghost {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); font-size: 13.5px; font-weight: 600;
  padding: 14px 18px; border-radius: 12px; cursor: pointer;
}
.btn-danger {
  background: transparent; border: 1px solid rgba(224,85,85,0.4);
  color: var(--red); font-size: 13px; font-weight: 600;
  padding: 12px 15px; border-radius: 12px; cursor: pointer;
}
.btn-row { display: flex; gap: 9px; margin-top: 18px; }

/* ══ MODAL ══ */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); z-index: 300;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2); border: 1px solid var(--border);
  border-top: 2px solid var(--honey);
  border-radius: 20px 20px 0 0; padding: 8px 0 0;
  width: 100%; max-width: 500px; max-height: 88vh; overflow-y: auto;
  animation: rise 0.26s cubic-bezier(0.34,1.5,0.64,1);
}
.modal-body { padding: 0 18px 34px; }
.modal-title { font-family: 'Playfair Display', serif; font-size: 19px; margin-bottom: 4px; }
.modal-title span { color: var(--honey); }
.modal-sub { font-size: 10.5px; color: var(--muted); margin-bottom: 18px; }
.modal label {
  font-size: 9.5px; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--muted); display: block; margin-bottom: 6px; margin-top: 15px; font-weight: 700;
}
.modal label:first-of-type { margin-top: 0; }
.modal input, .modal select, .modal textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-family: 'Nunito', sans-serif; font-size: 14px;
  padding: 11px 13px; border-radius: 11px; outline: none;
}
.modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--honey); }
.modal textarea { resize: none; line-height: 1.6; }

/* ══ STRENGTH SESSION ══ */
.ex-block {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 11px; margin-bottom: 9px;
}
.ex-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
.ex-name { font-size: 13.5px; font-weight: 700; flex: 1; min-width: 0; }
.ex-vol { font-size: 9.5px; color: var(--muted); white-space: nowrap; }
.set-row { display: grid; grid-template-columns: 22px 1fr 1fr 26px; gap: 6px; align-items: center; margin-bottom: 5px; }
.set-n { font-size: 10px; color: var(--muted); text-align: center; font-weight: 700; }
.set-in {
  background: var(--bg2); border: 1px solid var(--border); color: var(--text);
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 600;
  padding: 7px 8px; border-radius: 8px; outline: none; width: 100%; text-align: center;
}
.set-in:focus { border-color: var(--honey); }
.set-del { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 3px; }
.set-hdr { display: grid; grid-template-columns: 22px 1fr 1fr 26px; gap: 6px; margin-bottom: 4px; }
.set-hdr span { font-size: 8px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; text-align: center; font-weight: 700; }
.mini-btn {
  background: transparent; border: 1px dashed var(--border);
  color: var(--muted); font-size: 11px; font-weight: 600;
  padding: 7px; border-radius: 9px; cursor: pointer; width: 100%;
}
.mini-btn:hover { border-color: var(--honey); color: var(--honey); }
.tpl-chip {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-size: 11.5px; font-weight: 700;
  padding: 7px 13px; border-radius: 18px; cursor: pointer; white-space: nowrap;
}
.tpl-chip:active { border-color: var(--honey); color: var(--honey); }
.tpl-row { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }

/* ══ HISTORY TIMELINE ══ */
.tl { position: relative; padding-left: 17px; }
.tl::before { content: ''; position: absolute; left: 5px; top: 10px; bottom: 4px; width: 2px; background: var(--border); border-radius: 1px; }
.pw {
  position: relative; margin-bottom: 11px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 13px; overflow: hidden;
}
.pw::before {
  content: ''; position: absolute; left: -13px; top: 19px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--border2); border: 2px solid var(--bg);
}
.pw.open { border-color: var(--honey); }
.pw.open::before { background: var(--honey); }
.pw.hol::before { background: var(--away); }
.pw-h { display: flex; align-items: center; padding: 13px 13px 13px 15px; cursor: pointer; gap: 9px; }
.pw-info { flex: 1; min-width: 0; }
.pw-num { font-family: 'Playfair Display', serif; font-size: 16px; }
.pw-dates { font-size: 9.5px; color: var(--muted); margin-top: 1px; }
.pw-score { font-family: 'Playfair Display', serif; font-size: 20px; line-height: 1; }
.pw-slbl { font-size: 7.5px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; text-align: center; margin-top: 2px; }
.pw-badges { display: flex; gap: 4px; flex-shrink: 0; }
.pw-chev { font-size: 10px; color: var(--muted); transition: transform 0.25s; }
.pw.open .pw-chev { transform: rotate(180deg); }
.pw-bar { height: 3px; background: var(--border); margin: 0 13px; border-radius: 2px; overflow: hidden; }
.pw-bar-f { height: 100%; border-radius: 2px; }
.pw-body { display: none; padding: 12px 13px 4px; border-top: 1px solid var(--border); margin-top: 12px; }
.pw.open .pw-body { display: block; }
.pw-cat { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; margin: 11px 0 5px; font-weight: 700; }
.pw-cat:first-child { margin-top: 0; }
.pw-g { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.pw-g:last-child { border-bottom: none; }
.pw-gn { font-size: 12.5px; font-weight: 600; flex: 1; }
.pw-gr { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.pw-edit {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); font-size: 10.5px; font-weight: 700;
  padding: 5px 12px; border-radius: 16px; cursor: pointer;
}
.pw-edit.on { border-color: var(--honey); color: var(--honey); }
.pw-bar-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.pw-note {
  font-size: 11px; color: var(--muted); line-height: 1.5;
  background: var(--bg2); border-radius: 8px; padding: 8px 10px; margin-top: 6px;
  border-left: 2px solid var(--border2);
}
.hol-tag {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(79,179,201,0.14); border: 1px solid rgba(79,179,201,0.3);
  color: var(--away); font-size: 9px; font-weight: 700;
  padding: 2px 7px; border-radius: 9px;
}

/* ══ OVERVIEW ══ */
.ov-title { font-family: 'Playfair Display', serif; font-size: 23px; margin-bottom: 3px; }
.ov-title span { color: var(--honey); font-style: italic; }
.ov-sub { font-size: 9.5px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 18px; font-weight: 700; }
.ov-tabs { display: flex; gap: 6px; margin-bottom: 18px; overflow-x: auto; padding-bottom: 3px; }
.ov-tab {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--muted); font-size: 10px; font-weight: 700;
  letter-spacing: 1.2px; text-transform: uppercase;
  padding: 8px 13px; border-radius: 18px; cursor: pointer; white-space: nowrap;
}
.ov-tab.active { border-color: var(--honey); color: var(--honey); background: rgba(245,166,35,0.08); }
.ov-panel { display: none; }
.ov-panel.active { display: block; }
.q-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; margin-bottom: 20px; }
.q-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 10px 6px; text-align: center; }
.q-sv { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--honey); line-height: 1; }
.q-sl { font-size: 7.5px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; font-weight: 700; }
.q-cat { margin-bottom: 24px; }
.q-cat-h { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
.q-cat-t { font-family: 'Playfair Display', serif; font-size: 17px; flex: 1; }
.q-goal { margin-bottom: 15px; }
.q-gn { font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 700; }
.q-gs { font-size: 9.5px; color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 600; }
.q-grid { display: flex; gap: 3px; flex-wrap: wrap; }
.q-cell {
  width: calc((100% - 12*3px) / 13);
  aspect-ratio: 1; border-radius: 4px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; border: 1px solid transparent;
}
.q-sym { font-size: 9px; line-height: 1; }
.q-nm { font-size: 6.5px; line-height: 1; opacity: 0.9; }
.wk-fail   { background: rgba(224,85,85,0.2);   border-color: rgba(224,85,85,0.32); }
.wk-met    { background: rgba(109,191,124,0.2); border-color: rgba(109,191,124,0.32); }
.wk-exceed { background: rgba(245,200,66,0.2);  border-color: rgba(245,200,66,0.32); }
.wk-paused { background: rgba(79,179,201,0.18); border-color: rgba(79,179,201,0.3); }

<script>
/* ══════════════════════════════════════════════════════
   CONFIG — goal definitions are data, versioned by start
   ══════════════════════════════════════════════════════ */
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const GOAL_SET = {
  startDate: '2026-07-20',      // Monday of week 30, 2026
  categories: [
    { id:'health', name:'Health', icon:'🌿', color:'var(--health)', streak:true, goals:[
      { id:'strength', name:'Strength', icon:'🏋️', type:'detail',   unit:'kg',       min:3, qty:null },
      { id:'yoga',     name:'Yoga',     icon:'🧘', type:'tick',                       min:3, qty:null },
      { id:'skill',    name:'Skill',    icon:'🤸', type:'tick',                       min:2, qty:null },
    ]},
    { id:'learning', name:'Learning', icon:'📚', color:'var(--learning)', streak:true, goals:[
      { id:'reading',  name:'Reading',  icon:'📖', type:'quantity', unit:'chapters', min:3, qty:null, book:true },
      { id:'french',   name:'French',   icon:'🇫🇷', type:'quantity', unit:'chapters', min:2, qty:null },
      { id:'piano',    name:'Piano',    icon:'🎹', type:'quantity', unit:'minutes',  min:3, qty:null },
      { id:'lean',     name:'LEAN',     icon:'📐', type:'quantity', unit:'pages',    min:1, qty:null },
    ]},
    { id:'life', name:'Life', icon:'🌍', color:'var(--life)', streak:true, goals:[
      { id:'cooking',  name:'Own cooking', icon:'🍳', type:'tick',                    min:4, qty:null },
      { id:'invest',   name:'Investments', icon:'📈', type:'tick',                    min:1, qty:null },
      { id:'gaming',   name:'Gaming / Movies', icon:'🎮', type:'hours', unit:'hours', min:0, qty:null, scored:false },
    ]},
  ]
};

const CATS = GOAL_SET.categories;
const GOALS = CATS.flatMap(c => c.goals.map(g => ({ ...g, catId: c.id, catColor: c.color })));
const G = id => GOALS.find(g => g.id === id);
const isScored = g => g.scored !== false;

const PRESETS = {
  chapters: [1, 2, 3, 4],
  minutes:  [15, 30, 45, 60],
  pages:    [5, 10, 20, 30],
  hours:    [0.5, 1, 2, 3],
};
const STEP = { chapters: 1, minutes: 5, pages: 1, hours: 0.5 };

/* ══════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════ */
const KEY = 'hive_v2';

function blank() {
  return {
    logs: {},      // wk -> goalId -> [0/1 x7]
    qty: {},       // wk -> goalId -> [num x7]
    mins: {},      // wk -> goalId -> num
    qtyT: {},      // wk -> goalId -> num  (optional quantity target)
    notes: {},     // wk -> goalId -> str
    away: {},      // wk -> [0/1 x7]
    sessions: {},  // wk -> dayIdx -> [{name, sets:[{reps,kg}]}]
    partial: {},   // wk -> dayIdx -> true  (strength logged without full detail)
    books: { current: null, finished: [] },
    templates: [
      { id:'push', name:'Push', exercises:['Bench press','Overhead press','Dips','Triceps pushdown'] },
      { id:'pull', name:'Pull', exercises:['Deadlift','Pull-ups','Barbell row','Face pull'] },
      { id:'legs', name:'Legs', exercises:['Squat','Romanian deadlift','Leg press','Calf raise'] },
    ],
    lastEx: {},    // exerciseName -> [{reps,kg}]
  };
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.logs) {
      const b = blank();
      return { ...b, ...s, books: s.books || b.books, templates: s.templates || b.templates };
    }
  } catch (e) {}
  return blank();
}

function save() { localStorage.setItem(KEY, JSON.stringify(S)); }
let S = load();

/* ══════════════════════════════════════════════════════
   DATES
   ══════════════════════════════════════════════════════ */
function weekStart(d) {
  const x = new Date(d);
  const day = x.getDay();
  x.setDate(x.getDate() + (day === 0 ? -6 : 1 - day));
  x.setHours(0,0,0,0);
  return x;
}
function wkKey(d) {
  const x = weekStart(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
function wkNum(d) {
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = x.getUTCDay() || 7;
  x.setUTCDate(x.getUTCDate() + 4 - dn);
  const ys = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
  return Math.ceil((((x - ys) / 86400000) + 1) / 7);
}
function keyToDate(k) { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function fmtRange(ws) {
  const a = new Date(ws), b = new Date(ws); b.setDate(b.getDate()+6);
  return `${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]}`;
}

const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const NOW_WK = wkKey(TODAY);
const TODAY_I = Math.round((TODAY - weekStart(TODAY)) / 86400000);
const START_WK = wkKey(keyToDate(GOAL_SET.startDate));

const isFuture = wk => wk > NOW_WK;
const isNow    = wk => wk === NOW_WK;

/* ══════════════════════════════════════════════════════
   ACCESSORS
   ══════════════════════════════════════════════════════ */
function log(wk, id) {
  S.logs[wk] = S.logs[wk] || {};
  S.logs[wk][id] = S.logs[wk][id] || [0,0,0,0,0,0,0];
  return S.logs[wk][id];
}
function qty(wk, id) {
  S.qty[wk] = S.qty[wk] || {};
  S.qty[wk][id] = S.qty[wk][id] || [0,0,0,0,0,0,0];
  return S.qty[wk][id];
}
function awayArr(wk) {
  S.away[wk] = S.away[wk] || [0,0,0,0,0,0,0];
  return S.away[wk];
}
const days   = (wk,id) => log(wk,id).reduce((a,b)=>a+b,0);
const qtySum = (wk,id) => +(qty(wk,id).reduce((a,b)=>a+b,0)).toFixed(2);
const awayDays = wk => awayArr(wk).reduce((a,b)=>a+b,0);

function getMin(wk, id) {
  if (S.mins[wk] && S.mins[wk][id] !== undefined) return S.mins[wk][id];
  const g = G(id); return g ? g.min : 0;
}
function setMin(wk, id, v) {
  S.mins[wk] = S.mins[wk] || {};
  S.mins[wk][id] = Math.max(0, Math.min(7, v));
  save();
}
function getQtyT(wk, id) {
  if (S.qtyT[wk] && S.qtyT[wk][id] !== undefined) return S.qtyT[wk][id];
  const g = G(id); return g && g.qty ? g.qty : 0;
}
function setQtyT(wk, id, v) {
  S.qtyT[wk] = S.qtyT[wk] || {};
  S.qtyT[wk][id] = Math.max(0, v);
  save();
}
const getNote = (wk,id) => (S.notes[wk] && S.notes[wk][id]) || '';
function setNote(wk,id,t) { S.notes[wk] = S.notes[wk] || {}; S.notes[wk][id] = t; save(); }

function sessions(wk, di) {
  S.sessions[wk] = S.sessions[wk] || {};
  S.sessions[wk][di] = S.sessions[wk][di] || [];
  return S.sessions[wk][di];
}
function sessionVolume(exs) {
  return exs.reduce((t,e) => t + e.sets.reduce((s,x) => s + (+x.reps||0) * (+x.kg||0), 0), 0);
}
function weekVolume(wk) {
  let v = 0;
  const d = S.sessions[wk] || {};
  Object.keys(d).forEach(k => { v += sessionVolume(d[k]); });
  return Math.round(v);
}

/* ══════════════════════════════════════════════════════
   ACHIEVEMENT
   'fail' | 'met' | 'exceed' | 'skip' | 'paused' | 'live'
   Days decide the outcome. Quantity target is secondary.
   ══════════════════════════════════════════════════════ */
function ach(wk, id) {
  const g = G(id);
  if (!g || !isScored(g)) return 'skip';
  const min = getMin(wk, id);
  if (min === 0) return 'skip';
  const d = days(wk, id);
  if (d > min) return 'exceed';
  if (d >= min) return 'met';
  if (isNow(wk) || isFuture(wk)) return 'live';
  return awayDays(wk) > 0 ? 'paused' : 'fail';
}
function achLive(wk, id) {
  const a = ach(wk, id);
  return a === 'paused' ? 'live' : a;
}
const ACH_ICON = { fail:'✕', met:'✓', exceed:'★', skip:'—', paused:'⏸', live:'·' };
const ACH_EMOJI = { fail:'❌', met:'✅', exceed:'⭐', skip:'—', paused:'⏸️', live:'🔄' };

/* ══════════════════════════════════════════════════════
   STREAK — holiday weeks pause, never break
   ══════════════════════════════════════════════════════ */
function streak(catId) {
  const cat = CATS.find(c => c.id === catId);
  if (!cat || !cat.streak) return { n: 0, paused: false };
  const scored = cat.goals.filter(isScored);
  let n = 0, pausedRecently = false;
  const d = new Date(TODAY);
  for (let i = 0; i < 60; i++) {
    d.setDate(d.getDate() - 7);
    const wk = wkKey(d);
    if (wk < START_WK) break;
    const results = scored.map(g => ach(wk, g.id));
    const anyFail = results.includes('fail');
    const anyPaused = results.includes('paused');
    if (anyFail) break;
    if (anyPaused) { pausedRecently = pausedRecently || n === 0; continue; }  // hold, don't increment
    n++;
  }
  return { n, paused: pausedRecently };
}

/* ══════════════════════════════════════════════════════
   WEEK VIEW
   ══════════════════════════════════════════════════════ */
function renderWeek() {
  document.getElementById('wkNum').textContent = 'W' + wkNum(TODAY);
  document.getElementById('wkDates').textContent = fmtRange(weekStart(TODAY));

  const ws = weekStart(TODAY);
  const aw = awayArr(NOW_WK);

  const dr = document.getElementById('dayRow');
  dr.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(ws); d.setDate(d.getDate() + i);
    dr.innerHTML += `<div class="day-cell ${i===TODAY_I?'today':''} ${aw[i]?'away':''}">
      <div class="dn">${DAYS[i][0]}</div><div class="dd">${d.getDate()}</div></div>`;
  }

  const at = document.getElementById('awayToggles');
  at.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    at.innerHTML += `<button class="away-tog ${aw[i]?'on':''}" onclick="toggleAway(${i})" aria-label="Away ${DAYS[i]}">${DAYS[i][0]}</button>`;
  }

  const wrap = document.getElementById('catBlocks');
  wrap.innerHTML = '';

  CATS.forEach(cat => {
    const sec = document.createElement('div');
    sec.className = 'cat-section';
    const st = streak(cat.id);
    let pill = '';
    if (cat.streak && st.n > 0) pill = `<span class="streak-pill">🔥 ${st.n}w</span>`;
    else if (cat.streak && st.paused) pill = `<span class="streak-pill paused">⏸ held</span>`;

    sec.innerHTML = `<div class="cat-header">
      <span style="font-size:15px">${cat.icon}</span>
      <span class="cat-title" style="color:${cat.color}">${cat.name}</span>${pill}</div>`;

    cat.goals.forEach(g => sec.appendChild(goalCard(g, cat)));
    wrap.appendChild(sec);
  });
}

function goalCard(g, cat) {
  const wk = NOW_WK;
  const l = log(wk, g.id), q = qty(wk, g.id), aw = awayArr(wk);
  const d = days(wk, g.id), min = getMin(wk, g.id);
  const qs = qtySum(wk, g.id), qt = getQtyT(wk, g.id);
  const a = achLive(wk, g.id);
  const hasNote = getNote(wk, g.id).trim().length > 0;
  const scored = isScored(g);

  const card = document.createElement('div');
  card.className = 'goal-card' + (scored ? '' : ' unscored');
  card.style.borderLeftColor = cat.color;

  // badge
  let badge = '';
  if (!scored) badge = `<span class="ach-badge ach-skip">observed</span>`;
  else if (min === 0) badge = `<span class="ach-badge ach-skip">no target</span>`;
  else if (a === 'exceed') badge = `<span class="ach-badge ach-exceed">⭐ exceeded</span>`;
  else if (a === 'met') badge = `<span class="ach-badge ach-met">✓ reached</span>`;

  // subtitle
  let sub;
  if (!scored) sub = `${qs} ${g.unit} this week`;
  else if (min === 0) sub = 'Not targeted this week';
  else sub = `${d} of ${min} days` + (d > min ? ` · +${d-min}` : '');

  // headline number
  const headline = (g.type === 'quantity' || g.type === 'hours') ? qs : (g.type === 'detail' ? d : d);

  card.innerHTML = `
    <div class="goal-head">
      <div class="goal-left">
        <span class="goal-icon">${g.icon}</span>
        <div style="min-width:0">
          <div class="goal-name">${g.name} ${badge}</div>
          <div class="goal-sub">${sub}</div>
        </div>
      </div>
      <div class="goal-right">
        <span class="goal-count">${headline}</span>
        <button class="icon-btn ${hasNote?'active':''}" onclick="noteModal('${g.id}','${wk}')" aria-label="Notes">📝</button>
      </div>
    </div>`;

  // dots
  const dots = document.createElement('div');
  dots.className = 'dots';
  for (let i = 0; i < 7; i++) {
    const fut = i > TODAY_I;
    const done = l[i] === 1;
    const v = q[i] || 0;
    let cls = 'dot', inner = '<span class="pip"></span>';

    if (g.type === 'quantity') {
      cls += ' qty' + (v > 0 ? ' has' : '');
      inner = v > 0 ? `<span>${fmtQty(v, g.unit)}</span>` : '<span class="pip"></span>';
    } else if (g.type === 'hours') {
      cls += ' hours' + (v > 0 ? ' has' : '');
      inner = v > 0 ? `<span>${v}</span>` : '<span class="pip"></span>';
    } else if (done) cls += ' done';

    if (i === TODAY_I) cls += ' today-d';
    if (aw[i]) cls += ' away-d';
    if (fut) cls += ' future';

    const handler = fut ? '' :
      g.type === 'quantity' || g.type === 'hours' ? `openQP('${g.id}',${i},'${wk}')` :
      g.type === 'detail' ? `openSession('${wk}',${i})` :
      `tick('${g.id}',${i},'${wk}')`;

    dots.innerHTML += `<div class="dot-wrap"><span class="dot-lbl">${DAYS[i][0]}</span>
      <button class="${cls}" ${fut?'disabled':''} onclick="${handler}" aria-label="${g.name} ${DAYS[i]}">${inner}</button></div>`;
  }
  card.appendChild(dots);

  // progress
  if (scored && min > 0) {
    const pct = Math.min(100, Math.round(d / min * 100));
    const col = d > min ? 'var(--star)' : d >= min ? 'var(--green)' : cat.color;
    const lbl = d >= min ? '✓ reached' : `${min - d} to go`;
    const bar = document.createElement('div');
    bar.className = 'prog-row';
    bar.innerHTML = `<div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${col}"></div></div>
      <span class="prog-lbl">${lbl}</span>`;
    card.appendChild(bar);
  }

  // quantity secondary line
  if (g.type === 'quantity' || g.type === 'detail') {
    const line = document.createElement('div');
    line.className = 'qty-line';
    if (g.type === 'detail') {
      const vol = weekVolume(wk);
      line.innerHTML = `<span>Volume this week</span><b>${vol.toLocaleString('en-GB')} kg</b>`;
    } else if (qt > 0) {
      const hit = qs >= qt;
      line.innerHTML = `<span>${g.unit} target</span>
        <span class="${hit?'hit':''}"><b>${fmtQty(qs,g.unit)}</b> / ${fmtQty(qt,g.unit)} ${hit?'✓':''}</span>`;
    } else {
      line.innerHTML = `<span>${g.unit[0].toUpperCase()+g.unit.slice(1)} logged</span><b>${fmtQty(qs,g.unit)}</b>`;
    }
    card.appendChild(line);
  }

  // current book
  if (g.book && S.books.current) {
    const bl = document.createElement('div');
    bl.className = 'qty-line';
    bl.innerHTML = `<span>📖 ${esc(S.books.current.title)}</span>
      <button class="icon-btn" style="font-size:10px;font-weight:700;color:var(--honey)" onclick="openBooks()">Manage</button>`;
    card.appendChild(bl);
  }

  return card;
}

function fmtQty(v, unit) {
  if (unit === 'hours') return (Math.round(v*10)/10) + 'h';
  if (unit === 'minutes') return Math.round(v) + 'm';
  return String(Math.round(v*10)/10);
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function tick(id, i, wk) {
  const l = log(wk, id);
  l[i] = l[i] ? 0 : 1;
  save(); refresh();
  if (l[i]) toast('Logged');
}
function toggleAway(i) {
  const a = awayArr(NOW_WK);
  a[i] = a[i] ? 0 : 1;
  save(); refresh();
  toast(a[i] ? 'Marked away' : 'Away removed');
}

/* ══════════════════════════════════════════════════════
   QUANTITY PICKER
   ══════════════════════════════════════════════════════ */
let QP = { id:null, i:0, wk:null, val:0 };

function openQP(id, i, wk) {
  const g = G(id);
  QP = { id, i, wk, val: qty(wk, id)[i] || 0 };
  const ws = weekStart(keyToDate(wk));
  const d = new Date(ws); d.setDate(d.getDate() + i);
  document.getElementById('qpTitle').textContent = g.name;
  document.getElementById('qpSub').textContent = `${DAYS[i]} ${d.getDate()} ${MON[d.getMonth()]}`;
  document.getElementById('qpUnit').textContent = g.unit;
  const chips = document.getElementById('qpChips');
  chips.innerHTML = (PRESETS[g.unit] || [1,2,3,4])
    .map(v => `<button class="qp-chip" onclick="qpAdd(${v})">+${fmtQty(v, g.unit)}</button>`).join('');
  qpPaint();
  document.getElementById('qpOverlay').classList.add('open');
}
function qpPaint() {
  const g = G(QP.id);
  document.getElementById('qpVal').textContent = g.unit === 'hours' ? (Math.round(QP.val*10)/10) : Math.round(QP.val*10)/10;
}
function qpAdd(v) { QP.val = Math.round((QP.val + v) * 100) / 100; qpPaint(); }
function qpStep(dir) {
  const g = G(QP.id);
  QP.val = Math.max(0, Math.round((QP.val + dir * (STEP[g.unit] || 1)) * 100) / 100);
  qpPaint();
}
function qpClear() { QP.val = 0; qpPaint(); }
function qpSave() {
  const q = qty(QP.wk, QP.id);
  q[QP.i] = QP.val;
  const l = log(QP.wk, QP.id);
  l[QP.i] = QP.val > 0 ? 1 : 0;
  save();
  document.getElementById('qpOverlay').classList.remove('open');
  refresh();
  toast(QP.val > 0 ? 'Saved' : 'Cleared');
}
document.getElementById('qpOverlay').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});

/* ══════════════════════════════════════════════════════
   STRENGTH SESSION
   ══════════════════════════════════════════════════════ */
let SESS = { wk:null, i:0, exs:[] };

function openSession(wk, i) {
  SESS = { wk, i, exs: JSON.parse(JSON.stringify(sessions(wk, i))) };
  paintSession();
  document.getElementById('modal').classList.add('open');
}

function paintSession() {
  const ws = weekStart(keyToDate(SESS.wk));
  const d = new Date(ws); d.setDate(d.getDate() + SESS.i);
  const vol = Math.round(sessionVolume(SESS.exs));

  let html = `<div class="modal-title">🏋️ <span>Strength</span></div>
    <div class="modal-sub">${DAYS[SESS.i]} ${d.getDate()} ${MON[d.getMonth()]} · ${vol.toLocaleString('en-GB')} kg volume</div>`;

  if (S.templates.length) {
    html += `<div class="tpl-row">
      ${S.templates.map(t => `<button class="tpl-chip" onclick="loadTemplate('${t.id}')">${esc(t.name)}</button>`).join('')}
      <button class="tpl-chip" onclick="repeatLast()">↻ Repeat last</button>
    </div>`;
  }

  if (!SESS.exs.length) {
    html += `<div class="empty" style="padding:26px 10px">
      <div class="empty-ic">🏋️</div>
      <p>Pick a template above, repeat your last session, or add an exercise.</p></div>`;
  }

  SESS.exs.forEach((ex, ei) => {
    const evol = Math.round(ex.sets.reduce((s,x) => s + (+x.reps||0)*(+x.kg||0), 0));
    html += `<div class="ex-block">
      <div class="ex-head">
        <span class="ex-name">${esc(ex.name)}</span>
        <span class="ex-vol">${evol.toLocaleString('en-GB')} kg</span>
        <button class="set-del" onclick="delEx(${ei})" aria-label="Remove exercise">✕</button>
      </div>
      <div class="set-hdr"><span>#</span><span>Reps</span><span>Kg</span><span></span></div>`;
    ex.sets.forEach((st, si) => {
      html += `<div class="set-row">
        <span class="set-n">${si+1}</span>
        <input class="set-in" type="number" inputmode="numeric" value="${st.reps ?? ''}" placeholder="—"
          onchange="setVal(${ei},${si},'reps',this.value)">
        <input class="set-in" type="number" inputmode="decimal" step="0.5" value="${st.kg ?? ''}" placeholder="—"
          onchange="setVal(${ei},${si},'kg',this.value)">
        <button class="set-del" onclick="delSet(${ei},${si})" aria-label="Remove set">✕</button>
      </div>`;
    });
    html += `<button class="mini-btn" style="margin-top:6px" onclick="addSet(${ei})">+ Add set</button></div>`;
  });

  html += `<button class="mini-btn" onclick="addEx()">+ Add exercise</button>
    <div class="btn-row">
      <button class="btn-ghost" onclick="quickSave()">Quick save</button>
      <button class="btn-honey" onclick="saveSession()">Save session</button>
    </div>
    <p style="font-size:10px;color:var(--muted);margin-top:10px;line-height:1.5">
      Quick save marks the day done and flags it as logged without detail, so it never looks like a zero later.
    </p>`;

  if (sessions(SESS.wk, SESS.i).length || log(SESS.wk,'strength')[SESS.i]) {
    html += `<button class="btn-danger" style="width:100%;margin-top:10px" onclick="clearSession()">Clear this day</button>`;
  }

  document.getElementById('modalBody').innerHTML = html;
}

function setVal(ei, si, field, v) { SESS.exs[ei].sets[si][field] = v === '' ? null : +v; paintSession(); }
function addSet(ei) {
  const sets = SESS.exs[ei].sets;
  const last = sets[sets.length-1];
  sets.push(last ? { reps: last.reps, kg: last.kg } : { reps: null, kg: null });
  paintSession();
}
function delSet(ei, si) { SESS.exs[ei].sets.splice(si,1); paintSession(); }
function delEx(ei) { SESS.exs.splice(ei,1); paintSession(); }
function addEx() {
  const name = prompt('Exercise name');
  if (!name || !name.trim()) return;
  const prev = S.lastEx[name.trim()];
  SESS.exs.push({ name: name.trim(), sets: prev ? JSON.parse(JSON.stringify(prev)) : [{reps:null,kg:null}] });
  paintSession();
}
function loadTemplate(tid) {
  const t = S.templates.find(x => x.id === tid);
  if (!t) return;
  t.exercises.forEach(n => {
    if (SESS.exs.some(e => e.name === n)) return;
    const prev = S.lastEx[n];
    SESS.exs.push({ name: n, sets: prev ? JSON.parse(JSON.stringify(prev)) : [{reps:null,kg:null}] });
  });
  paintSession();
  toast(t.name + ' loaded');
}
function repeatLast() {
  // find most recent day with a logged session
  const keys = Object.keys(S.sessions).sort().reverse();
  for (const wk of keys) {
    const dd = S.sessions[wk];
    const idxs = Object.keys(dd).map(Number).sort((a,b)=>b-a);
    for (const i of idxs) {
      if (wk === SESS.wk && i === SESS.i) continue;
      if (dd[i] && dd[i].length) {
        SESS.exs = JSON.parse(JSON.stringify(dd[i]));
        paintSession();
        toast('Last session copied');
        return;
      }
    }
  }
  toast('No previous session yet');
}
function saveSession() {
  const clean = SESS.exs.filter(e => e.name && e.sets.length);
  S.sessions[SESS.wk] = S.sessions[SESS.wk] || {};
  S.sessions[SESS.wk][SESS.i] = clean;
  clean.forEach(e => { S.lastEx[e.name] = JSON.parse(JSON.stringify(e.sets)); });
  const l = log(SESS.wk, 'strength');
  l[SESS.i] = clean.length ? 1 : 0;
  if (S.partial[SESS.wk]) delete S.partial[SESS.wk][SESS.i];
  save(); closeModal(); refresh();
  toast(clean.length ? 'Session saved' : 'Day cleared');
}
function quickSave() {
  const l = log(SESS.wk, 'strength');
  l[SESS.i] = 1;
  S.partial[SESS.wk] = S.partial[SESS.wk] || {};
  S.partial[SESS.wk][SESS.i] = true;
  save(); closeModal(); refresh();
  toast('Marked done — detail pending');
}
function clearSession() {
  if (!confirm('Clear this training day?')) return;
  if (S.sessions[SESS.wk]) delete S.sessions[SESS.wk][SESS.i];
  if (S.partial[SESS.wk]) delete S.partial[SESS.wk][SESS.i];
  log(SESS.wk,'strength')[SESS.i] = 0;
  save(); closeModal(); refresh();
  toast('Day cleared');
}

function openBooks() {

  let html = `<div class="modal-title">📚 <span>Books</span></div>
    <div class="modal-sub">${S.books.finished.length} finished in ${TODAY.getFullYear()}</div>`;

  if (cur) {
    html += `<label>Currently reading</label>
      <div class="book-item current">
        <span style="font-size:18px">📖</span>
        <div style="flex:1;min-width:0">
          <div class="book-t">${esc(cur.title)}</div>

        </div>
      </div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn-ghost" onclick="dropBook()">Remove</button>
        <button class="btn-honey" onclick="finishBook()">Mark finished</button>

  } else {
    html += `<label>Start a book</label>
      <input id="bookIn" placeholder="Title" />
      <div class="btn-row"><button class="btn-honey" onclick="startBook()">Start reading</button></div>`;

  if (S.books.finished.length) {
    html += `<label style="margin-top:22px">Finished</label>`;

      html += `<div class="book-item">
        <span style="font-size:16px">✅</span>
        <div style="flex:1;min-width:0">
          <div class="book-t">${esc(b.title)}</div>
          <div class="book-m">Finished ${new Date(b.finished).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>
        </div></div>`;

  html += `<div class="btn-row"><button class="btn-ghost" style="flex:1" onclick="closeModal()">Close</button></div>`;

function startBook() {
  const t = document.getElementById('bookIn').value.trim();
  if (!t) return;
  S.books.current = { title: t, started: new Date().toISOString() };
  save(); openBooks(); refresh(); toast('Book started');
}
function finishBook() {
  if (!S.books.current) return;
  S.books.finished.push({ ...S.books.current, finished: new Date().toISOString() });
  S.books.current = null;
  save(); openBooks(); refresh(); toast('Book finished 🎉');
}
function dropBook() {
  if (!confirm('Remove without marking finished?')) return;
  S.books.current = null; save(); openBooks(); refresh();
}

/* ══════════════════════════════════════════════════════
   HISTORY
   ══════════════════════════════════════════════════════ */
let openWk = null, editWk = null;

function renderPast() {
  const wks = [];
  let d = keyToDate(START_WK);
  while (wkKey(d) < NOW_WK) { wks.push(wkKey(d)); d.setDate(d.getDate() + 7); }
  wks.reverse();

  document.getElementById('pastSub').textContent = `${wks.length} completed ${wks.length === 1 ? 'week' : 'weeks'}`;
  const c = document.getElementById('pastList');

  if (!wks.length) {
    c.innerHTML = `<div class="empty"><div class="empty-ic">🐝</div>
      <p>No finished weeks yet.<br>Your first one lands here on Monday.</p></div>`;
    return;
  }

  c.innerHTML = '<div class="tl" id="tl"></div>';
  const tl = document.getElementById('tl');
  wks.forEach(wk => tl.appendChild(weekCard(wk)));
}

function weekCard(wk) {
  const ws = keyToDate(wk);
  const open = openWk === wk;
  const hol = awayDays(wk);

  let f=0, m=0, x=0, p=0, done=0, target=0;
  GOALS.filter(isScored).forEach(g => {
    const a = ach(wk, g.id);
    if (a==='fail') f++; else if (a==='met') m++; else if (a==='exceed') x++; else if (a==='paused') p++;
    const mn = getMin(wk, g.id);
    if (mn > 0) { done += Math.min(days(wk,g.id), mn); target += mn; }
  });
  const score = target ? Math.round(done / target * 100) : 0;
  const col = score >= 100 ? 'var(--star)' : score >= 75 ? 'var(--green)' : score >= 45 ? 'var(--honey)' : 'var(--red)';

  const el = document.createElement('div');
  el.className = 'pw' + (open ? ' open' : '') + (hol ? ' hol' : '');
  el.innerHTML = `
    <div class="pw-h" onclick="toggleWk('${wk}')">
      <div class="pw-info">
        <div class="pw-num">Week ${wkNum(ws)}</div>
        <div class="pw-dates">${fmtRange(ws)} ${hol ? `<span class="hol-tag">✈ ${hol}d away</span>` : ''}</div>
      </div>
      <div>
        <div class="pw-score" style="color:${col}">${score}%</div>
        <div class="pw-slbl">score</div>
      </div>
      <div class="pw-badges">
        ${x?`<span class="ach-badge ach-exceed">⭐${x}</span>`:''}
        ${m?`<span class="ach-badge ach-met">✓${m}</span>`:''}
        ${p?`<span class="ach-badge ach-paused">⏸${p}</span>`:''}
        ${f?`<span class="ach-badge ach-fail">✕${f}</span>`:''}
      </div>
      <span class="pw-chev">▼</span>
    </div>
    <div class="pw-bar"><div class="pw-bar-f" style="width:${Math.min(score,100)}%;background:${col}"></div></div>
    <div class="pw-body" id="body_${wk}">${open ? weekBody(wk, editWk === wk) : ''}</div>`;
  return el;
}

function weekBody(wk, ed) {
  const hol = awayDays(wk);
  let h = `<div class="pw-bar-top">
    <span style="font-size:10.5px;color:var(--muted)">${ed ? 'Tap days to fix logs, adjust targets below' : 'Full week breakdown'}</span>
    <button class="pw-edit ${ed?'on':''}" onclick="toggleEdit('${wk}')">${ed ? '✓ Done' : '✏️ Edit'}</button>
  </div>`;

  if (ed) {
    const aw = awayArr(wk);
    h += `<div class="away-strip" style="margin-bottom:14px">
      <div class="away-label">Days <b>away or at an event</b></div>
      <div class="away-toggles">
        ${[0,1,2,3,4,5,6].map(i => `<button class="away-tog ${aw[i]?'on':''}" onclick="toggleAwayPast('${wk}',${i})">${DAYS[i][0]}</button>`).join('')}
      </div></div>`;
  } else if (hol) {
    h += `<div class="info-box" style="margin-bottom:12px">✈ <b>${hol} day${hol>1?'s':''} away</b> this week — lower numbers here are expected, and streaks were held rather than broken.</div>`;
  }

  CATS.forEach(cat => {
    h += `<div class="pw-cat" style="color:${cat.color}">${cat.icon} ${cat.name}</div>`;
    cat.goals.forEach(g => {
      const a = ach(wk, g.id);
      const d = days(wk, g.id), mn = getMin(wk, g.id);
      const qs = qtySum(wk, g.id), qt = getQtyT(wk, g.id);
      const note = getNote(wk, g.id);
      const scored = isScored(g);

      let right;
      if (!scored) right = `<b style="color:var(--life)">${fmtQty(qs, g.unit)}</b>`;
      else if (g.type === 'quantity') right = `${ACH_EMOJI[a]} ${d}/${mn} · ${fmtQty(qs,g.unit)}`;
      else if (g.type === 'detail') right = `${ACH_EMOJI[a]} ${d}/${mn} · ${weekVolume(wk).toLocaleString('en-GB')}kg`;
      else right = `${ACH_EMOJI[a]} ${d}/${mn}`;

      h += `<div class="pw-g"><span style="font-size:15px">${g.icon}</span>
        <span class="pw-gn">${g.name}</span><span class="pw-gr">${right}</span></div>`;

      if (ed) {
        const l = log(wk, g.id), q = qty(wk, g.id);
        h += `<div class="dots" style="margin-bottom:8px">`;
        for (let i = 0; i < 7; i++) {
          const v = q[i] || 0;
          let cls = 'dot', inner = '<span class="pip"></span>';
          if (g.type === 'quantity' || g.type === 'hours') {
            cls += (g.type === 'hours' ? ' hours' : ' qty') + (v > 0 ? ' has' : '');
            if (v > 0) inner = `<span>${fmtQty(v, g.unit)}</span>`;
          } else if (l[i]) cls += ' done';
          const handler = (g.type === 'quantity' || g.type === 'hours')
            ? `openQP('${g.id}',${i},'${wk}')`
            : g.type === 'detail' ? `openSession('${wk}',${i})` : `tickPast('${wk}','${g.id}',${i})`;
          h += `<div class="dot-wrap"><span class="dot-lbl">${DAYS[i][0]}</span>
            <button class="${cls}" onclick="${handler}">${inner}</button></div>`;
        }
        h += `</div>`;
        if (scored) {
          h += `<div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0 10px">
            <span style="font-size:10.5px;color:var(--muted)">Days target</span>
            <div class="rv-ctrl">
              <button class="rv-btn" onclick="bumpMin('${wk}','${g.id}',-1)">−</button>
              <span class="rv-val" id="pm_${wk}_${g.id}">${mn}</span>
              <button class="rv-btn" onclick="bumpMin('${wk}','${g.id}',1)">+</button>
            </div></div>`;
        }
      }

      if (note.trim()) h += `<div class="pw-note">${esc(note)}</div>`;
    });
  });

  return h;
}

function toggleWk(wk) {
  openWk = openWk === wk ? null : wk;
  editWk = null;
  renderPast();
}
function toggleEdit(wk) {
  editWk = editWk === wk ? null : wk;
  const b = document.getElementById('body_' + wk);
  if (b) b.innerHTML = weekBody(wk, editWk === wk);
}
function tickPast(wk, id, i) {
  const l = log(wk, id);
  l[i] = l[i] ? 0 : 1;
  save();
  const b = document.getElementById('body_' + wk);
  if (b) b.innerHTML = weekBody(wk, true);
}
function toggleAwayPast(wk, i) {
  const a = awayArr(wk);
  a[i] = a[i] ? 0 : 1;
  save();
  const b = document.getElementById('body_' + wk);
  if (b) b.innerHTML = weekBody(wk, true);
}
function bumpMin(wk, id, d) {
  setMin(wk, id, getMin(wk, id) + d);
  const el = document.getElementById(`pm_${wk}_${id}`);
  if (el) el.textContent = getMin(wk, id);
}

/* ══════════════════════════════════════════════════════
   OVERVIEW
   ══════════════════════════════════════════════════════ */
let ovTab = 'all';

function renderOver() {
  const q = Math.floor(TODAY.getMonth()/3) + 1, y = TODAY.getFullYear();
  document.getElementById('ovTitle').innerHTML = `Q${q} <span>${y}</span>`;
  document.getElementById('ovSub').textContent = 'Quarterly progress';

  const tabs = [{id:'all',label:'All'}, ...CATS.map(c=>({id:c.id,label:c.name}))];
  const tabsEl = document.getElementById('ovTabs');
  const panels = document.getElementById('ovPanels');
  tabsEl.innerHTML = '';
  panels.innerHTML = '';

  tabs.forEach(t => {
    const b = document.createElement('button');
    b.className = 'ov-tab' + (ovTab === t.id ? ' active' : '');
    b.textContent = t.label;
    b.onclick = () => { ovTab = t.id; renderOver(); };
    tabsEl.appendChild(b);

    const p = document.createElement('div');
    p.className = 'ov-panel' + (ovTab === t.id ? ' active' : '');
    p.innerHTML = quarterPanel(t.id, q, y);
    panels.appendChild(p);
  });
}

function quarterWeeks(q, y) {
  const out = [];
  let d = weekStart(new Date(y, (q-1)*3, 1));
  const end = new Date(y, q*3, 0);
  while (d <= end) {
    const k = wkKey(d);
    if (k >= START_WK) out.push(k);
    d = new Date(d); d.setDate(d.getDate() + 7);
  }
  return out;
}

function quarterPanel(tab, q, y) {
  const wks = quarterWeeks(q, y);
  const past = wks.filter(w => !isFuture(w));
  const cats = tab === 'all' ? CATS : CATS.filter(c => c.id === tab);
  const scoped = cats.flatMap(c => c.goals).filter(isScored);

  let done=0, target=0, exceeded=0, perfect=0, holWeeks=0;
  past.forEach(wk => {
    if (awayDays(wk) > 0) holWeeks++;
    let ok = true, any = false;
    scoped.forEach(g => {
      const mn = getMin(wk, g.id), d = days(wk, g.id);
      if (mn > 0) {
        any = true; target += mn; done += Math.min(d, mn);
        if (d > mn) exceeded++;
        if (d < mn) ok = false;
      }
    });
    if (any && ok) perfect++;
  });
  const rate = target ? Math.round(done/target*100) : 0;

  let h = `<div class="q-stats">
    <div class="q-stat"><div class="q-sv">${rate}%</div><div class="q-sl">Hit rate</div></div>
    <div class="q-stat"><div class="q-sv">${perfect}</div><div class="q-sl">Full weeks</div></div>
    <div class="q-stat"><div class="q-sv">${exceeded}</div><div class="q-sl">Exceeded</div></div>
    <div class="q-stat"><div class="q-sv">${holWeeks}</div><div class="q-sl">Away wks</div></div>
  </div>`;

  cats.forEach(cat => {
    h += `<div class="q-cat"><div class="q-cat-h">
      <span style="font-size:16px">${cat.icon}</span>
      <span class="q-cat-t" style="color:${cat.color}">${cat.name}</span></div>`;

    cat.goals.forEach(g => {
      const scored = isScored(g);
      let f=0,m=0,x=0,p=0,tracked=0;
      past.forEach(wk => {
        const a = ach(wk, g.id);
        if (a==='fail'){f++;tracked++;} else if (a==='met'){m++;tracked++;}
        else if (a==='exceed'){x++;tracked++;} else if (a==='paused'){p++;}
      });
      const pct = tracked ? Math.round((m+x)/tracked*100) : 0;

      // header line
      let sub;
      if (!scored) {
        const tot = past.reduce((s,wk) => s + qtySum(wk, g.id), 0);
        const avg = past.length ? tot/past.length : 0;
        sub = `${fmtQty(tot,g.unit)} total · ${fmtQty(avg,g.unit)}/wk avg`;
      } else if (g.type === 'quantity') {
        const tot = past.reduce((s,wk) => s + qtySum(wk, g.id), 0);
        sub = `${m+x}/${tracked} wks · ${pct}% · ${fmtQty(tot,g.unit)}`;
      } else if (g.type === 'detail') {
        const tot = past.reduce((s,wk) => s + weekVolume(wk), 0);
        sub = `${m+x}/${tracked} wks · ${pct}% · ${Math.round(tot/1000)}t volume`;
      } else {
        sub = `${m+x}/${tracked} wks · ${pct}%`;
      }

      h += `<div class="q-goal">
        <div class="q-gn"><span>${g.icon} ${g.name}</span><span class="q-gs">${sub}</span></div>`;

      if (scored) {
        h += `<div class="q-grid">`;
        wks.forEach(wk => {
          const fut = isFuture(wk);
          const a = fut ? 'future' : ach(wk, g.id);
          const d = days(wk, g.id), mn = getMin(wk, g.id);
          let cls = 'q-cell ', inner = '';
          if (fut) { cls += 'wk-future'; }
          else if (a === 'skip') { cls += 'wk-skip'; inner = `<span class="q-sym">—</span>`; }
          else if (a === 'live') { cls += 'wk-skip'; inner = `<span class="q-sym">·</span><span class="q-nm">${d}/${mn}</span>`; }
          else {
            cls += 'wk-' + a;
            inner = `<span class="q-sym">${ACH_ICON[a]}</span><span class="q-nm">${d}/${mn}</span>`;
          }
          h += `<div class="${cls}" title="W${wkNum(keyToDate(wk))}: ${d}/${mn}">${inner}</div>`;
        });
        h += `</div><div class="q-tally">
          <span style="color:var(--star)">★ ${x}</span>
          <span style="color:var(--green)">✓ ${m}</span>
          <span style="color:var(--red)">✕ ${f}</span>
          ${p?`<span style="color:var(--away)">⏸ ${p}</span>`:''}
        </div>`;
      }

      // sparkline for quantity / hours / detail
      if (g.type === 'quantity' || g.type === 'hours' || g.type === 'detail') {
        const vals = past.map(wk => g.type === 'detail' ? weekVolume(wk) : qtySum(wk, g.id));
        const max = Math.max(...vals, 1);
        h += `<div class="spark">${vals.map(v =>
          `<div class="spark-b" style="height:${Math.max(2, v/max*34)}px;background:${v>0?cat.color:'var(--border)'};opacity:${v>0?0.75:1}"></div>`
        ).join('')}</div>`;
      }

      h += `</div>`;
    });
    h += `</div>`;
  });

  if (!past.length) h += `<div class="empty"><div class="empty-ic">🔭</div><p>Nothing to show yet — this fills in as weeks complete.</p></div>`;

  return h;
}

/* ══════════════════════════════════════════════════════
   REVIEW — current week
   ══════════════════════════════════════════════════════ */
function renderReview() {
  const c = document.getElementById('reviewBody');
  const wk = NOW_WK;
  const aw = awayArr(wk);

  let h = `<div class="info-box">
    <b>Week ${wkNum(TODAY)}</b> · ${fmtRange(weekStart(TODAY))}<br>
    Fix anything you forgot to log, and set this week's targets.
  </div>
  <div class="away-strip" style="margin-bottom:18px">
    <div class="away-label">Days <b>away or at an event</b></div>
    <div class="away-toggles">
      ${[0,1,2,3,4,5,6].map(i => `<button class="away-tog ${aw[i]?'on':''}" onclick="toggleAway(${i});renderReview()">${DAYS[i][0]}</button>`).join('')}
    </div></div>`;

  c.innerHTML = h;

  CATS.forEach(cat => {
    const head = document.createElement('div');
    head.className = 'cat-header';
    head.innerHTML = `<span>${cat.icon}</span><span class="cat-title" style="color:${cat.color};font-size:15px">${cat.name}</span>`;
    c.appendChild(head);

    const card = document.createElement('div');
    card.className = 'rv-card';

    cat.goals.forEach(g => {
      const l = log(wk, g.id), q = qty(wk, g.id);
      const d = days(wk, g.id), mn = getMin(wk, g.id);
      const qt = getQtyT(wk, g.id), qs = qtySum(wk, g.id);
      const scored = isScored(g);

      const row = document.createElement('div');
      row.className = 'rv-g';

      let dots = `<div class="dots" style="margin:8px 0">`;
      for (let i = 0; i < 7; i++) {
        const fut = i > TODAY_I;
        const v = q[i] || 0;
        let cls = 'dot', inner = '<span class="pip"></span>';
        if (g.type === 'quantity' || g.type === 'hours') {
          cls += (g.type === 'hours' ? ' hours' : ' qty') + (v > 0 ? ' has' : '');
          if (v > 0) inner = `<span>${fmtQty(v, g.unit)}</span>`;
        } else if (l[i]) cls += ' done';
        if (aw[i]) cls += ' away-d';
        if (fut) cls += ' future';
        const handler = fut ? '' :
          (g.type === 'quantity' || g.type === 'hours') ? `openQP('${g.id}',${i},'${wk}')` :
          g.type === 'detail' ? `openSession('${wk}',${i})` : `tick('${g.id}',${i},'${wk}');renderReview()`;
        dots += `<div class="dot-wrap"><span class="dot-lbl">${DAYS[i][0]}</span>
          <button class="${cls}" ${fut?'disabled':''} onclick="${handler}">${inner}</button></div>`;
      }
      dots += `</div>`;

      row.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <span style="font-size:13.5px;font-weight:700">${g.icon} ${g.name}</span>
          <span style="font-family:'Playfair Display',serif;font-size:17px;color:var(--honey)">
            ${(g.type==='quantity'||g.type==='hours') ? fmtQty(qs,g.unit) : d}
          </span>
        </div>${dots}`;

      if (scored) {
        row.innerHTML += `<div style="display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:10.5px;color:var(--muted)">Days target · max 7</span>
          <div class="rv-ctrl">
            <button class="rv-btn" onclick="bumpMinLive('${g.id}',-1)">−</button>
            <span class="rv-val" id="rm_${g.id}">${mn}</span>
            <button class="rv-btn" onclick="bumpMinLive('${g.id}',1)">+</button>
          </div></div>`;

        if (g.type === 'quantity') {
          row.innerHTML += `<div style="display:flex;align-items:center;justify-content:space-between;margin-top:9px">
            <span style="font-size:10.5px;color:var(--muted)">${g.unit} target · optional</span>
            <div class="rv-ctrl">
              <button class="rv-btn" onclick="bumpQtyT('${g.id}',-1)">−</button>
              <span class="rv-val" id="rq_${g.id}">${qt || '—'}</span>
              <button class="rv-btn" onclick="bumpQtyT('${g.id}',1)">+</button>
            </div></div>`;
        }
      }

      card.appendChild(row);
    });

    c.appendChild(card);
  });
}
function bumpMinLive(id, d) {
  setMin(NOW_WK, id, getMin(NOW_WK, id) + d);
  const el = document.getElementById('rm_' + id);
  if (el) el.textContent = getMin(NOW_WK, id);
}
function bumpQtyT(id, dir) {
  const g = G(id);
  const step = STEP[g.unit] || 1;
  const mult = g.unit === 'minutes' ? 6 : g.unit === 'pages' ? 5 : 1;
  setQtyT(NOW_WK, id, getQtyT(NOW_WK, id) + dir * step * mult);
  const el = document.getElementById('rq_' + id);
  if (el) el.textContent = getQtyT(NOW_WK, id) || '—';
}

/* ══════════════════════════════════════════════════════
   EXPORT
   ══════════════════════════════════════════════════════ */
function openExport() {
  openModal(`<div class="modal-title">📊 <span>Export data</span></div>
    <div class="modal-sub">CSV opens straight in Excel</div>
    <div class="info-box">
      <b>Weekly summary</b> gives one row per week per goal — days, target, outcome, quantity.
      <b>Training log</b> gives one row per set, for volume and progression analysis.
    </div>
    <div style="display:flex;flex-direction:column;gap:9px">
      <button class="btn-honey" onclick="exportWeekly()">Weekly summary CSV</button>
      <button class="btn-honey" onclick="exportTraining()">Training log CSV</button>
    </div>
    <div class="btn-row"><button class="btn-ghost" style="flex:1" onclick="closeModal()">Close</button></div>`);
}

function csvEsc(v) {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function download(name, text) {
  const b = new Blob([text], { type:'text/csv;charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
}

function allWeeks() {
  const out = [];
  let d = keyToDate(START_WK);
  while (wkKey(d) <= NOW_WK) { out.push(wkKey(d)); d.setDate(d.getDate() + 7); }
  return out;
}

function exportWeekly() {
  const rows = [['week_number','week_start','category','goal','type','unit','days_done','days_target','outcome','quantity','quantity_target','volume_kg','days_away','note']];
  allWeeks().forEach(wk => {
    const wn = wkNum(keyToDate(wk));
    GOALS.forEach(g => {
      const cat = CATS.find(c => c.id === g.catId);
      rows.push([
        wn, wk, cat.name, g.name, g.type, g.unit || '',
        days(wk, g.id), getMin(wk, g.id), ach(wk, g.id),
        (g.type==='quantity'||g.type==='hours') ? qtySum(wk,g.id) : '',
        g.type==='quantity' ? (getQtyT(wk,g.id) || '') : '',
        g.type==='detail' ? weekVolume(wk) : '',
        awayDays(wk), getNote(wk, g.id)
      ]);
    });
  });
  download(`hive_weekly_${new Date().toISOString().slice(0,10)}.csv`,
    rows.map(r => r.map(csvEsc).join(',')).join('\n'));
  toast('Weekly CSV downloaded');
}

function exportTraining() {
  const rows = [['week_number','date','exercise','set_number','reps','kg','volume_kg']];
  Object.keys(S.sessions).sort().forEach(wk => {
    const ws = keyToDate(wk);
    Object.keys(S.sessions[wk]).map(Number).sort((a,b)=>a-b).forEach(i => {
      const d = new Date(ws); d.setDate(d.getDate() + i);
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      S.sessions[wk][i].forEach(ex => {
        ex.sets.forEach((st, si) => {
          rows.push([wkNum(d), ds, ex.name, si+1, st.reps ?? '', st.kg ?? '', (+st.reps||0)*(+st.kg||0)]);
        });
      });
    });
  });
  if (rows.length === 1) { toast('No sessions logged yet'); return; }
  download(`hive_training_${new Date().toISOString().slice(0,10)}.csv`,
    rows.map(r => r.map(csvEsc).join(',')).join('\n'));
  toast('Training CSV downloaded');
}

/* ══════════════════════════════════════════════════════
   SYNC
   ══════════════════════════════════════════════════════ */
function openSync() {
  const last = localStorage.getItem('hive_v2_export');
  openModal(`<div class="modal-title">🔄 <span>Sync &amp; backup</span></div>
    <div class="modal-sub">Move data between phone and laptop</div>
    <div class="info-box">Each device keeps its own copy. Export here, import there.</div>
    <button class="btn-honey" style="width:100%" onclick="exportJSON()">Download backup</button>
    <label style="margin-top:20px">Restore from a backup</label>
    <label for="impFile" style="display:flex;align-items:center;justify-content:center;gap:9px;
      padding:14px;border-radius:12px;border:1.5px dashed var(--border);cursor:pointer;
      font-size:13px;color:var(--muted);font-weight:700;letter-spacing:0;text-transform:none;margin:0">
      📂 Choose backup file
      <input type="file" id="impFile" accept=".json" style="display:none" onchange="importJSON(event)">
    </label>
    <p style="font-size:10.5px;color:var(--muted);margin-top:8px;text-align:center">
      Replaces everything on this device.
    </p>
    <p style="font-size:10.5px;color:var(--muted);margin-top:14px;text-align:center">
      ${last ? 'Last export ' + new Date(last).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : 'No export yet on this device'}
    </p>
    <div class="btn-row"><button class="btn-ghost" style="flex:1" onclick="closeModal()">Close</button></div>`);
}
function exportJSON() {
  const blob = new Blob([JSON.stringify({ v:2, at:new Date().toISOString(), state:S }, null, 2)], {type:'application/json'});
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = `hive_backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
  localStorage.setItem('hive_v2_export', new Date().toISOString());
  toast('Backup downloaded');
}
function importJSON(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const p = JSON.parse(ev.target.result);
      if (!p.state || !p.state.logs) { toast('That file is not a Hive backup'); return; }
      const n = Object.keys(p.state.logs).length;
      if (!confirm(`Restore ${n} weeks from ${p.at ? new Date(p.at).toLocaleDateString('en-GB') : 'unknown date'}?\n\nThis replaces everything on this device.`)) {
        e.target.value = ''; return;
      }
      S = { ...blank(), ...p.state };
      save(); closeModal(); refresh();
      toast(`${n} weeks restored`);
    } catch (err) { toast('Could not read that file'); }
    e.target.value = '';
  };
  r.readAsText(f);
}

/* ══════════════════════════════════════════════════════
   NAV / MENU / TOAST
   ══════════════════════════════════════════════════════ */
let view = 'week';
function go(name, btn) {
  closeMenu();
  view = name;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('v-' + name).classList.add('active');
  btn.classList.add('active');
  window.scrollTo({ top: 0 });
  refresh();
}
function refresh() {
  if (view === 'week') renderWeek();
  else if (view === 'past') renderPast();
  else if (view === 'over') renderOver();
  else if (view === 'review') renderReview();
  else renderWeek();
}

let menuOpen = false;
function toggleMenu(btn) {
  const m = document.getElementById('menu');
  menuOpen = !menuOpen;
  m.style.display = menuOpen ? 'block' : 'none';
  if (menuOpen) setTimeout(() => document.addEventListener('click', outside), 10);
  else document.removeEventListener('click', outside);
}
function closeMenu() {
  menuOpen = false;
  document.getElementById('menu').style.display = 'none';
  document.removeEventListener('click', outside);
}
function outside(e) {
  const m = document.getElementById('menu');
  const b = document.querySelector('.bnav-btn:last-child');
  if (!m.contains(e.target) && !b.contains(e.target)) closeMenu();
}

let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ══ INIT ══ */
renderWeek();
</script>
