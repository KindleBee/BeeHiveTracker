<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hive — Life Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #17130a;
  --bg2:      #1e1809;
  --surface:  #272010;
  --surface2: #322913;
  --border:   #473a1b;
  --border2:  #5c4a22;
  --honey:    #f5a623;
  --gold:     #f0c040;
  --cream:    #f5e6c0;
  --muted:    #8a7548;
  --text:     #f0e0b0;
  --green:    #6dbf7c;
  --red:      #e05555;
  --star:     #f5c842;
  --health:   #e8a040;
  --learning: #60b8e8;
  --life:     #b083e0;
  --away:     #4fb3c9;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  padding-bottom: 92px;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(ellipse at 15% 10%, rgba(245,166,35,0.07) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 90%, rgba(176,131,224,0.04) 0%, transparent 55%);
  pointer-events: none; z-index: 0;
}

button { font-family: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--honey); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ══ HEADER ══ */
header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, var(--bg) 78%, transparent);
  padding: 18px 18px 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.logo { display: flex; align-items: center; gap: 9px; }
.logo-text { font-family: 'Playfair Display', serif; font-size: 21px; color: var(--honey); line-height: 1; }
.logo-text span {
  font-size: 9px; display: block; color: var(--muted);
  font-family: 'Nunito', sans-serif; font-weight: 600;
  letter-spacing: 2.4px; text-transform: uppercase; margin-top: 3px;
}
.week-pill {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 6px 12px; text-align: right; flex-shrink: 0;
}
.week-pill b { color: var(--honey); display: block; font-size: 14px; font-weight: 800; line-height: 1.1; }
.week-pill span { font-size: 9.5px; color: var(--muted); letter-spacing: 0.3px; }

/* ══ VIEWS ══ */
.view { display: none; padding: 14px 16px 0; position: relative; z-index: 1; }
.view.active { display: block; }

/* ══ DAY STRIP ══ */
.day-row { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 8px; }
.day-cell {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: 6px 2px; text-align: center;
}
.day-cell.today { border-color: var(--honey); background: rgba(245,166,35,0.07); }
.day-cell.away { border-color: var(--away); background: rgba(79,179,201,0.09); }
.day-cell .dn { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; }
.day-cell .dd { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--text); margin-top: 1px; }
.day-cell.today .dd { color: var(--honey); }

/* away strip */
.away-strip {
  display: grid; grid-template-columns: 1fr auto; gap: 8px;
  align-items: center; margin-bottom: 18px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 11px; padding: 8px 10px;
}
.away-label { font-size: 10px; color: var(--muted); letter-spacing: 0.4px; line-height: 1.35; }
.away-label b { color: var(--away); font-weight: 700; }
.away-toggles { display: flex; gap: 3px; }
.away-tog {
  width: 26px; height: 26px; border-radius: 7px;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); font-size: 9px; font-weight: 700; cursor: pointer;
  transition: all 0.15s;
}
.away-tog.on { background: rgba(79,179,201,0.2); border-color: var(--away); color: var(--away); }

/* ══ CATEGORY ══ */
.cat-section { margin-bottom: 22px; }
.cat-header {
  display: flex; align-items: center; gap: 9px;
  margin-bottom: 11px; padding-bottom: 7px;
  border-bottom: 1px solid var(--border);
}
.cat-title { font-family: 'Playfair Display', serif; font-size: 17px; flex: 1; }
.streak-pill {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(245,200,66,0.1); border: 1px solid rgba(245,200,66,0.28);
  border-radius: 11px; padding: 2px 9px; font-size: 10px; color: var(--star); font-weight: 700;
}
.streak-pill.paused { background: rgba(79,179,201,0.1); border-color: rgba(79,179,201,0.28); color: var(--away); }

/* ══ GOAL CARD ══ */
.goal-card {
  background: var(--surface); border: 1px solid var(--border);
  border-left-width: 3px; border-radius: 13px;
  padding: 13px; margin-bottom: 9px;
}
.goal-card.unscored { border-left-color: var(--muted) !important; opacity: 0.94; }
.goal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
.goal-left { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; }
.goal-icon { font-size: 19px; flex-shrink: 0; }
.goal-name { font-size: 14.5px; font-weight: 700; line-height: 1.2; }
.goal-sub { font-size: 9.5px; color: var(--muted); margin-top: 2px; letter-spacing: 0.2px; }
.goal-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.goal-count { font-family: 'Playfair Display', serif; font-size: 19px; color: var(--honey); min-width: 20px; text-align: right; }
.icon-btn {
  background: none; border: none; cursor: pointer;
  font-size: 14px; padding: 4px 5px; border-radius: 6px;
  color: var(--muted); transition: all 0.15s;
}
.icon-btn.active { color: var(--honey); }

.ach-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 9.5px; padding: 2px 7px; border-radius: 10px;
  font-weight: 700; letter-spacing: 0.2px; white-space: nowrap;
}
.ach-fail   { background: rgba(224,85,85,0.16);  color: var(--red);   border: 1px solid rgba(224,85,85,0.3); }
.ach-met    { background: rgba(109,191,124,0.16); color: var(--green); border: 1px solid rgba(109,191,124,0.3); }
.ach-exceed { background: rgba(245,200,66,0.16);  color: var(--star);  border: 1px solid rgba(245,200,66,0.3); }
.ach-skip   { background: rgba(138,117,72,0.12);  color: var(--muted); border: 1px solid var(--border); }
.ach-paused { background: rgba(79,179,201,0.14);  color: var(--away);  border: 1px solid rgba(79,179,201,0.3); }

/* ══ DAY DOTS ══ */
.dots { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 9px; }
.dot-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.dot-lbl { font-size: 7px; color: var(--muted); letter-spacing: 0.4px; font-weight: 700; }
.dot {
  width: 100%; aspect-ratio: 1;
  border-radius: 7px; border: 1.5px solid var(--border);
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.12s, border-color 0.15s, background 0.15s;
  font-size: 10px; font-weight: 800; color: var(--muted);
}
.dot .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all 0.18s; }
.dot.done { border-color: rgba(109,191,124,0.5); background: rgba(109,191,124,0.1); }
.dot.done .pip { background: var(--green); box-shadow: 0 0 7px rgba(109,191,124,0.45); }
.dot.qty { color: var(--green); }
.dot.qty.has { border-color: rgba(109,191,124,0.5); background: rgba(109,191,124,0.1); }
.dot.hours.has { border-color: rgba(176,131,224,0.5); background: rgba(176,131,224,0.12); color: var(--life); }
.dot.cardio.has { border-color: rgba(232,160,64,0.55); background: rgba(232,160,64,0.14); }
.dot.today-d { border-color: var(--honey); }
.dot.away-d { border-style: dashed; border-color: var(--away); }
.dot.future { opacity: 0.28; cursor: default; }
.dot:active:not(.future) { transform: scale(0.88); }

/* picker grid for cardio */
.pick-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
.pick-grid.three { grid-template-columns: repeat(3,1fr); }
.pick {
  background: var(--surface); border: 1.5px solid var(--border);
  color: var(--text); font-family: 'Nunito', sans-serif;
  font-size: 13px; font-weight: 700; padding: 12px 8px;
  border-radius: 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  transition: all 0.15s;
}
.pick.on { border-color: var(--honey); color: var(--honey); background: rgba(245,166,35,0.08); }
.pick-ic { font-size: 19px; line-height: 1; }
.cardio-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 9.5px; font-weight: 700; padding: 2px 7px;
  border-radius: 9px; border: 1px solid var(--border); color: var(--muted);
}

/* ══ PROGRESS ══ */
.prog-row { display: flex; align-items: center; gap: 8px; }
.prog-bar { flex: 1; height: 4px; background: var(--border); border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 3px; transition: width 0.45s cubic-bezier(0.34,1.5,0.64,1); }
.prog-lbl { font-size: 9.5px; color: var(--muted); white-space: nowrap; font-weight: 600; }

.qty-line {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--border);
  font-size: 10px; color: var(--muted);
}
.qty-line b { color: var(--text); font-weight: 700; }
.qty-line .hit { color: var(--green); }

/* ══ QUANTITY PICKER ══ */
.qp-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.82); z-index: 320;
  align-items: flex-end; justify-content: center;
}
.qp-overlay.open { display: flex; }
.qp {
  background: var(--bg2); border: 1px solid var(--border);
  border-top: 2px solid var(--honey);
  border-radius: 20px 20px 0 0; padding: 8px 0 30px;
  width: 100%; max-width: 500px;
  animation: rise 0.24s cubic-bezier(0.34,1.5,0.64,1);
}
@keyframes rise { from { transform: translateY(36px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
.grip { width: 38px; height: 4px; background: var(--border2); border-radius: 3px; margin: 0 auto 16px; }
.qp-body { padding: 0 18px; }
.qp-title { font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 3px; }
.qp-sub { font-size: 10.5px; color: var(--muted); margin-bottom: 16px; }
.qp-val {
  text-align: center; font-family: 'Playfair Display', serif;
  font-size: 40px; color: var(--honey); line-height: 1; margin-bottom: 3px;
}
.qp-unit { text-align: center; font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
.qp-chips { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
.qp-chip {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-size: 13px; font-weight: 700;
  padding: 9px 15px; border-radius: 20px; cursor: pointer; transition: all 0.15s;
}
.qp-chip:hover, .qp-chip:active { border-color: var(--honey); color: var(--honey); }
.qp-step { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; }
.qp-sbtn {
  width: 44px; height: 44px; border-radius: 13px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.qp-sbtn:active { border-color: var(--honey); color: var(--honey); }

/* ══ BUTTONS ══ */
.btn-honey {
  flex: 1; background: var(--honey); color: #17130a;
  border: none; font-size: 13.5px; font-weight: 800;
  padding: 14px; border-radius: 12px; cursor: pointer; letter-spacing: 0.2px;
}
.btn-honey:active { opacity: 0.85; }
.btn-ghost {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); font-size: 13.5px; font-weight: 600;
  padding: 14px 18px; border-radius: 12px; cursor: pointer;
}
.btn-danger {
  background: transparent; border: 1px solid rgba(224,85,85,0.4);
  color: var(--red); font-size: 13px; font-weight: 600;
  padding: 12px 15px; border-radius: 12px; cursor: pointer;
}
.btn-row { display: flex; gap: 9px; margin-top: 18px; }

/* ══ MODAL ══ */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); z-index: 300;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2); border: 1px solid var(--border);
  border-top: 2px solid var(--honey);
  border-radius: 20px 20px 0 0; padding: 8px 0 0;
  width: 100%; max-width: 500px; max-height: 88vh; overflow-y: auto;
  animation: rise 0.26s cubic-bezier(0.34,1.5,0.64,1);
}
.modal-body { padding: 0 18px 34px; }
.modal-title { font-family: 'Playfair Display', serif; font-size: 19px; margin-bottom: 4px; }
.modal-title span { color: var(--honey); }
.modal-sub { font-size: 10.5px; color: var(--muted); margin-bottom: 18px; }
.modal label {
  font-size: 9.5px; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--muted); display: block; margin-bottom: 6px; margin-top: 15px; font-weight: 700;
}
.modal label:first-of-type { margin-top: 0; }
.modal input, .modal select, .modal textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-family: 'Nunito', sans-serif; font-size: 14px;
  padding: 11px 13px; border-radius: 11px; outline: none;
}
.modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--honey); }
.modal textarea { resize: none; line-height: 1.6; }

/* ══ STRENGTH SESSION ══ */
.ex-block {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 11px; margin-bottom: 9px;
}
.ex-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
.ex-name { font-size: 13.5px; font-weight: 700; flex: 1; min-width: 0; }
.ex-last { font-size: 9.5px; color: var(--muted); margin-top: 2px; letter-spacing: 0.2px; }
.ex-vol { font-size: 9.5px; color: var(--muted); white-space: nowrap; }
.set-row { display: grid; grid-template-columns: 22px 1fr 1fr 26px; gap: 6px; align-items: center; margin-bottom: 5px; }
.set-n { font-size: 10px; color: var(--muted); text-align: center; font-weight: 700; }
.set-in {
  background: var(--bg2); border: 1px solid var(--border); color: var(--text);
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 600;
  padding: 7px 8px; border-radius: 8px; outline: none; width: 100%; text-align: center;
}
.set-in:focus { border-color: var(--honey); }
.set-in::placeholder { color: var(--muted); opacity: 0.5; }
.set-del { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 3px; }
.set-hdr { display: grid; grid-template-columns: 22px 1fr 1fr 26px; gap: 6px; margin-bottom: 4px; }
.set-hdr span { font-size: 8px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; text-align: center; font-weight: 700; }
.mini-btn {
  background: transparent; border: 1px dashed var(--border);
  color: var(--muted); font-size: 11px; font-weight: 600;
  padding: 7px; border-radius: 9px; cursor: pointer; width: 100%;
}
.mini-btn:hover { border-color: var(--honey); color: var(--honey); }
.tpl-chip {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-size: 11.5px; font-weight: 700;
  padding: 7px 13px; border-radius: 18px; cursor: pointer; white-space: nowrap;
}
.tpl-chip:active { border-color: var(--honey); color: var(--honey); }
.tpl-row { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }

/* ══ HISTORY TIMELINE ══ */
.tl { position: relative; padding-left: 17px; }
.tl::before { content: ''; position: absolute; left: 5px; top: 10px; bottom: 4px; width: 2px; background: var(--border); border-radius: 1px; }
.pw {
  position: relative; margin-bottom: 11px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 13px; overflow: hidden;
}
.pw::before {
  content: ''; position: absolute; left: -13px; top: 19px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--border2); border: 2px solid var(--bg);
}
.pw.open { border-color: var(--honey); }
.pw.open::before { background: var(--honey); }
.pw.hol::before { background: var(--away); }
.pw-h { display: flex; align-items: center; padding: 13px 13px 13px 15px; cursor: pointer; gap: 9px; }
.pw-info { flex: 1; min-width: 0; }
.pw-num { font-family: 'Playfair Display', serif; font-size: 16px; }
.pw-dates { font-size: 9.5px; color: var(--muted); margin-top: 1px; }
.pw-score { font-family: 'Playfair Display', serif; font-size: 20px; line-height: 1; }
.pw-slbl { font-size: 7.5px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; text-align: center; margin-top: 2px; }
.pw-badges { display: flex; gap: 4px; flex-shrink: 0; }
.pw-chev { font-size: 10px; color: var(--muted); transition: transform 0.25s; }
.pw.open .pw-chev { transform: rotate(180deg); }
.pw-bar { height: 3px; background: var(--border); margin: 0 13px; border-radius: 2px; overflow: hidden; }
.pw-bar-f { height: 100%; border-radius: 2px; }
.pw-body { display: none; padding: 12px 13px 4px; border-top: 1px solid var(--border); margin-top: 12px; }
.pw.open .pw-body { display: block; }
.pw-cat { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; margin: 11px 0 5px; font-weight: 700; }
.pw-cat:first-child { margin-top: 0; }
.pw-g { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.pw-g:last-child { border-bottom: none; }
.pw-gn { font-size: 12.5px; font-weight: 600; flex: 1; }
.pw-gr { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.pw-edit {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); font-size: 10.5px; font-weight: 700;
  padding: 5px 12px; border-radius: 16px; cursor: pointer;
}
.pw-edit.on { border-color: var(--honey); color: var(--honey); }
.pw-bar-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.pw-note {
  font-size: 11px; color: var(--muted); line-height: 1.5;
  background: var(--bg2); border-radius: 8px; padding: 8px 10px; margin-top: 6px;
  border-left: 2px solid var(--border2);
}
.hol-tag {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(79,179,201,0.14); border: 1px solid rgba(79,179,201,0.3);
  color: var(--away); font-size: 9px; font-weight: 700;
  padding: 2px 7px; border-radius: 9px;
}

/* ══ OVERVIEW ══ */
.ov-title { font-family: 'Playfair Display', serif; font-size: 23px; margin-bottom: 3px; }
.ov-title span { color: var(--honey); font-style: italic; }
.ov-sub { font-size: 9.5px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 18px; font-weight: 700; }
.ov-tabs { display: flex; gap: 6px; margin-bottom: 18px; overflow-x: auto; padding-bottom: 3px; }
.ov-tab {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--muted); font-size: 10px; font-weight: 700;
  letter-spacing: 1.2px; text-transform: uppercase;
  padding: 8px 13px; border-radius: 18px; cursor: pointer; white-space: nowrap;
}
.ov-tab.active { border-color: var(--honey); color: var(--honey); background: rgba(245,166,35,0.08); }
.ov-panel { display: none; }
.ov-panel.active { display: block; }
.q-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; margin-bottom: 20px; }
.q-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 10px 6px; text-align: center; }
.q-sv { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--honey); line-height: 1; }
.q-sl { font-size: 7.5px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; font-weight: 700; }
.q-cat { margin-bottom: 24px; }
.q-cat-h { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
.q-cat-t { font-family: 'Playfair Display', serif; font-size: 17px; flex: 1; }
.q-goal { margin-bottom: 15px; }
.q-gn { font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 700; }
.q-gs { font-size: 9.5px; color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 600; }
.q-grid { display: flex; gap: 3px; flex-wrap: wrap; }
.q-cell {
  width: calc((100% - 12*3px) / 13);
  aspect-ratio: 1; border-radius: 4px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; border: 1px solid transparent;
}
.q-sym { font-size: 9px; line-height: 1; }
.q-nm { font-size: 6.5px; line-height: 1; opacity: 0.9; }
.wk-fail   { background: rgba(224,85,85,0.2);   border-color: rgba(224,85,85,0.32); }
.wk-met    { background: rgba(109,191,124,0.2); border-color: rgba(109,191,124,0.32); }
.wk-exceed { background: rgba(245,200,66,0.2);  border-color: rgba(245,200,66,0.32); }
.wk-paused { background: rgba(79,179,201,0.18); border-color: rgba(79,179,201,0.3); }
.wk-future { background: var(--surface); opacity: 0.35; }
.wk-skip   { background: var(--surface); opacity: 0.45; }
.q-tally { display: flex; gap: 8px; margin-top: 6px; font-size: 9.5px; color: var(--muted); font-weight: 600; }
.q-goal.drill { cursor: pointer; border-radius: 10px; margin-left: -6px; margin-right: -6px; padding: 6px; transition: background 0.15s; }
.q-goal.drill:active { background: var(--surface); }
.q-more { font-size: 9px; color: var(--honey); font-weight: 700; letter-spacing: 0.5px; }
.spark-wrap { margin-top: 7px; }
.spark-lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 9px; color: var(--muted); margin-top: 4px; font-weight: 600; }

/* drill-down */
.drill-sec { font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
.drill-ex { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px; margin-bottom: 9px; }
.drill-ex-h { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
.drill-ex-n { font-size: 13px; font-weight: 700; }
.drill-ex-m { font-size: 9.5px; color: var(--muted); margin-top: 2px; }
.drill-best { font-family: 'Playfair Display', serif; font-size: 17px; color: var(--honey); line-height: 1; }
.drill-line { width: 100%; height: 30px; margin: 8px 0 4px; overflow: visible; }
.drill-row { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-top: 1px solid var(--border); font-size: 11px; }
.drill-date { color: var(--muted); font-size: 9.5px; width: 58px; flex-shrink: 0; font-weight: 600; }
.drill-sets { flex: 1; min-width: 0; color: var(--text); font-size: 11px; }
.drill-vol { color: var(--muted); font-size: 9.5px; white-space: nowrap; }
.drill-kind { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px; margin-bottom: 9px; }
.drill-kind-h { display: flex; align-items: center; gap: 8px; }

/* template editing */
.tpl-ex-row { display: grid; grid-template-columns: 20px 1fr 26px; gap: 7px; align-items: center; margin-bottom: 5px; }
.tpl-ex-move { display: flex; flex-direction: column; gap: 1px; }
.tpl-arrow {
  background: none; border: none; color: var(--muted);
  font-size: 8px; line-height: 1; cursor: pointer; padding: 2px;
}
.tpl-arrow:disabled { opacity: 0.25; cursor: default; }
.tpl-arrow:not(:disabled):active { color: var(--honey); }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 34px; margin-top: 7px; }
.spark-b {
  width: calc((100% - 12*3px) / 13);
  flex: 0 0 auto;
  border-radius: 2px 2px 0 0; min-height: 2px; background: var(--border2);
}

/* ══ REVIEW ══ */
.rv-card { background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 13px; margin-bottom: 14px; }
.rv-g { padding: 11px 0; }
.rv-g + .rv-g { border-top: 1px solid var(--border); }
.rv-ctrl { display: flex; align-items: center; gap: 9px; }
.rv-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  width: 29px; height: 29px; border-radius: 8px; cursor: pointer; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
}
.rv-btn:active { border-color: var(--honey); color: var(--honey); }
.rv-val { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--honey); min-width: 20px; text-align: center; }

/* ══ BOOKS ══ */
.book-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 11px; padding: 11px 13px; margin-bottom: 8px;

}

.book-t { font-size: 13px; font-weight: 700; flex: 1; }

/* ══ NAV ══ */
.bnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg2); border-top: 1px solid var(--border);
  display: flex; padding: 7px 0 20px; z-index: 200;
}
.bnav-btn {
  flex: 1; background: none; border: none; color: var(--muted);
  font-size: 8.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
  cursor: pointer; padding: 4px 2px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.bnav-btn.active { color: var(--honey); }
.bnav-ic { font-size: 18px; line-height: 1; }

/* ══ MENU ══ */
.menu {
  display: none; position: fixed; bottom: 70px; right: 10px;
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 15px; padding: 7px; z-index: 250;
  box-shadow: 0 -6px 28px rgba(0,0,0,0.5); min-width: 178px;

}

  font-size: 13.5px; font-weight: 600; padding: 10px 11px;
  border-radius: 9px; cursor: pointer; text-align: left;
}
.menu-i:hover { background: var(--surface); }

/* ══ TOAST ══ */
.toast {
  position: fixed; bottom: 96px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--honey); color: #17130a;
  font-size: 13px; font-weight: 800;
  padding: 9px 20px; border-radius: 22px;
  opacity: 0; transition: all 0.28s; pointer-events: none; z-index: 400; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.empty { text-align: center; padding: 46px 20px; color: var(--muted); }
.empty-ic { font-size: 34px; margin-bottom: 12px; }

  background: var(--surface); border: 1px solid var(--border);

  font-size: 11px; color: var(--muted); line-height: 1.6;
}
.info-box b { color: var(--text); }
</style>

<script>
/* ══════════════════════════════════════════════════════
   CONFIG — goal definitions are data, versioned by start
   ══════════════════════════════════════════════════════ */
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const GOAL_SET = {
  startDate: '2026-07-20',      // Monday of week 30, 2026
  categories: [
    { id:'health', name:'Health', icon:'🌿', color:'var(--health)', streak:true, goals:[
      { id:'strength', name:'Strength', icon:'🏋️', type:'detail', unit:'kg',      min:3, target:'days' },
      { id:'cardio',   name:'Cardio',   icon:'🏃', type:'cardio', unit:'km', min:2, target:'days' },
      { id:'yoga',     name:'Yoga',     icon:'🧘', type:'tick',                    min:3, target:'days' },
      { id:'skill',    name:'Skill',    icon:'🤸', type:'tick',                    min:2, target:'days' },
    ]},
    { id:'learning', name:'Learning', icon:'📚', color:'var(--learning)', streak:true, goals:[
      { id:'reading',  name:'Reading',  icon:'📖', type:'quantity', unit:'chapters', min:1, qty:2, target:'quantity', book:true },
      { id:'french',   name:'French',   icon:'🇫🇷', type:'quantity', unit:'chapters', min:1, qty:2, target:'quantity' },
      { id:'piano',    name:'Piano',    icon:'🎹', type:'quantity', unit:'minutes',  min:3, target:'days' },
      { id:'lean',     name:'LEAN',     icon:'📐', type:'quantity', unit:'pages',    min:1, target:'days' },
    ]},
    { id:'life', name:'Life', icon:'🌍', color:'var(--life)', streak:true, goals:[
      { id:'cooking',  name:'Own cooking', icon:'🍳', type:'tick',                    min:4, target:'days' },
      { id:'invest',   name:'Investments', icon:'📈', type:'tick',                    min:1, target:'days' },
      { id:'gaming',   name:'Gaming / Movies', icon:'🎮', type:'hours', unit:'hours', min:0, target:'days', scored:false },
    ]},
  ]
};

const CARDIO_KINDS = [
  { id:'stairs',    name:'Stairs',    icon:'🪜', level:true  },
  { id:'bike',      name:'Bike',      icon:'🚲', level:true  },
  { id:'treadmill', name:'Treadmill', icon:'🏃', level:true  },
  { id:'outside',   name:'Outside',   icon:'🌳', level:false },
];

const CATS = GOAL_SET.categories;
const GOALS = CATS.flatMap(c => c.goals.map(g => ({ ...g, catId: c.id, catColor: c.color })));
const G = id => GOALS.find(g => g.id === id);
const isScored = g => g.scored !== false;

const PRESETS = {
  chapters: [1, 2, 3, 4],
  minutes:  [15, 30, 45, 60],
  pages:    [5, 10, 20, 30],
  hours:    [0.5, 1, 2, 3],
};
const STEP = { chapters: 1, minutes: 5, pages: 1, hours: 0.5 };

/* ══════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════ */
const KEY = 'hive_v2';

function blank() {
  return {
    logs: {},      // wk -> goalId -> [0/1 x7]
    qty: {},       // wk -> goalId -> [num x7]
    mins: {},      // wk -> goalId -> num
    qtyT: {},      // wk -> goalId -> num  (optional quantity target)
    notes: {},     // wk -> goalId -> str
    away: {},      // wk -> [0/1 x7]
    sessions: {},  // wk -> dayIdx -> [{name, sets:[{reps,kg}]}]
    cardio: {},    // wk -> dayIdx -> {kind, minutes, intensity}
    books: { current: null, finished: [] },
    bodyweight: null,
    templates: defaultTemplates(),
    lastEx: {},    // exerciseName -> [{reps,kg}]
  };
}

function defaultTemplates() {
  return [
    { id:'push', name:'Push', exercises:[
      'Bench press','Incline bench press','Dips','Shoulder press',
      'Face pulls / rear delt fly','Overhead triceps extension'
    ]},
    { id:'pull', name:'Pull', exercises:[
      'Lat pulldown (wide grip)','Vertical row','Pull-ups','Bent-over barbell row'
    ]},
    { id:'legs', name:'Legs', exercises:[
      'Deadlift','Zercher squat','Bulgarian split squat','Standing calf raise','Leg press','Seated leg curl'
    ]},
  ];
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.logs) {
      const b = blank();
      return { ...b, ...s, books: s.books || b.books, templates: s.templates || b.templates };
    }
  } catch (e) {}
  return blank();
}

function save() { localStorage.setItem(KEY, JSON.stringify(S)); }
let S = load();

/* ══════════════════════════════════════════════════════
   DATES
   ══════════════════════════════════════════════════════ */
function weekStart(d) {
  const x = new Date(d);
  const day = x.getDay();
  x.setDate(x.getDate() + (day === 0 ? -6 : 1 - day));
  x.setHours(0,0,0,0);
  return x;
}
function wkKey(d) {
  const x = weekStart(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
function wkNum(d) {
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = x.getUTCDay() || 7;
  x.setUTCDate(x.getUTCDate() + 4 - dn);
  const ys = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
  return Math.ceil((((x - ys) / 86400000) + 1) / 7);
}
function keyToDate(k) { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function fmtRange(ws) {
  const a = new Date(ws), b = new Date(ws); b.setDate(b.getDate()+6);
  return `${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]}`;
}

const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const NOW_WK = wkKey(TODAY);
const TODAY_I = Math.round((TODAY - weekStart(TODAY)) / 86400000);
const START_WK = wkKey(keyToDate(GOAL_SET.startDate));

const isFuture = wk => wk > NOW_WK;
const isNow    = wk => wk === NOW_WK;

/* ══════════════════════════════════════════════════════
   ACCESSORS
   ══════════════════════════════════════════════════════ */
function log(wk, id) {
  S.logs[wk] = S.logs[wk] || {};
  S.logs[wk][id] = S.logs[wk][id] || [0,0,0,0,0,0,0];
  return S.logs[wk][id];
}
function qty(wk, id) {
  S.qty[wk] = S.qty[wk] || {};
  S.qty[wk][id] = S.qty[wk][id] || [0,0,0,0,0,0,0];
  return S.qty[wk][id];
}
function awayArr(wk) {
  S.away[wk] = S.away[wk] || [0,0,0,0,0,0,0];
  return S.away[wk];
}
const days   = (wk,id) => log(wk,id).reduce((a,b)=>a+b,0);
const qtySum = (wk,id) => +(qty(wk,id).reduce((a,b)=>a+b,0)).toFixed(2);
const awayDays = wk => awayArr(wk).reduce((a,b)=>a+b,0);

function getMin(wk, id) {
  if (S.mins[wk] && S.mins[wk][id] !== undefined) return S.mins[wk][id];
  const g = G(id); return g ? g.min : 0;
}
function setMin(wk, id, v) {
  S.mins[wk] = S.mins[wk] || {};
  S.mins[wk][id] = Math.max(0, Math.min(7, v));
  save();
}
function getQtyT(wk, id) {
  if (S.qtyT[wk] && S.qtyT[wk][id] !== undefined) return S.qtyT[wk][id];
  const g = G(id); return g && g.qty ? g.qty : 0;
}
function setQtyT(wk, id, v) {
  S.qtyT[wk] = S.qtyT[wk] || {};
  S.qtyT[wk][id] = Math.max(0, v);
  save();
}
const getNote = (wk,id) => (S.notes[wk] && S.notes[wk][id]) || '';
function setNote(wk,id,t) { S.notes[wk] = S.notes[wk] || {}; S.notes[wk][id] = t; save(); }

function sessions(wk, di) {
  S.sessions[wk] = S.sessions[wk] || {};
  S.sessions[wk][di] = S.sessions[wk][di] || [];
  return S.sessions[wk][di];
}

function cardioDay(wk, di) {
  S.cardio[wk] = S.cardio[wk] || {};
  return S.cardio[wk][di] || null;
}
function setCardio(wk, di, entry) {
  S.cardio[wk] = S.cardio[wk] || {};
  if (entry) S.cardio[wk][di] = entry;
  else delete S.cardio[wk][di];
  log(wk, 'cardio')[di] = entry ? 1 : 0;
  qty(wk, 'cardio')[di] = entry ? (+entry.km || 0) : 0;
  save();
}
function cardioKm(wk) {
  const d = S.cardio[wk] || {};
  return +Object.keys(d).reduce((t,k) => t + (+d[k].km || 0), 0).toFixed(2);
}
const CK = id => CARDIO_KINDS.find(k => k.id === id) || CARDIO_KINDS[0];

/* Reps may be "5" or "30s" (a hold — excluded from volume).
   Kg may be "80", "BW", or "BW+20". */
function parseReps(v) {
  if (v === null || v === undefined || v === '') return { n: 0, isTime: false };
  const s = String(v).trim();
  const isTime = /s$/i.test(s);
  const n = parseFloat(s.replace(/[^0-9.]/g, '')) || 0;
  return { n, isTime };
}
function parseKg(v) {
  if (v === null || v === undefined || v === '') return 0;
  const s = String(v).trim();
  if (/^bw/i.test(s)) {
    const bw = +S.bodyweight || 0;
    const extra = parseFloat(s.replace(/^bw/i, '').replace(/[^0-9.\-+]/g, '')) || 0;
    return bw + extra;
  }
  return parseFloat(s.replace(',', '.')) || 0;
}
function setVolume(st) {
  const r = parseReps(st.reps);
  if (r.isTime) return 0;
  return r.n * parseKg(st.kg);
}
function sessionVolume(exs) {
  return exs.reduce((t, e) => t + e.sets.reduce((s, x) => s + setVolume(x), 0), 0);
}
function weekVolume(wk) {
  let v = 0;
  const d = S.sessions[wk] || {};
  Object.keys(d).forEach(k => { v += sessionVolume(d[k]); });
  return Math.round(v);
}

/* ══════════════════════════════════════════════════════
   ACHIEVEMENT
   'fail' | 'met' | 'exceed' | 'skip' | 'paused' | 'live'
   Goals score on days, or on quantity where target='quantity'.
   ══════════════════════════════════════════════════════ */
function ach(wk, id) {
  const g = G(id);
  if (!g || !isScored(g)) return 'skip';

  const byQty = g.target === 'quantity';
  const goal = byQty ? getQtyT(wk, id) : getMin(wk, id);
  if (goal === 0) return 'skip';

  const have = byQty ? qtySum(wk, id) : days(wk, id);
  if (have > goal) return 'exceed';
  if (have >= goal) return 'met';
  if (isNow(wk) || isFuture(wk)) return 'live';
  return awayDays(wk) > 0 ? 'paused' : 'fail';
}

/* Progress pair for display: [current, target, unitLabel] */
function prog(wk, id) {
  const g = G(id);
  if (g.target === 'quantity') return [qtySum(wk,id), getQtyT(wk,id), g.unit];
  return [days(wk,id), getMin(wk,id), 'days'];
}
function achLive(wk, id) {
  const a = ach(wk, id);
  return a === 'paused' ? 'live' : a;
}
const ACH_ICON = { fail:'✕', met:'✓', exceed:'★', skip:'—', paused:'⏸', live:'·' };
const ACH_EMOJI = { fail:'❌', met:'✅', exceed:'⭐', skip:'—', paused:'⏸️', live:'🔄' };

/* ══════════════════════════════════════════════════════
   STREAK — holiday weeks pause, never break
   ══════════════════════════════════════════════════════ */
function streak(catId) {
  const cat = CATS.find(c => c.id === catId);
  if (!cat || !cat.streak) return { n: 0, paused: false };
  const scored = cat.goals.filter(isScored);
  let n = 0, pausedRecently = false;
  const d = new Date(TODAY);
  for (let i = 0; i < 60; i++) {
    d.setDate(d.getDate() - 7);
    const wk = wkKey(d);
    if (wk < START_WK) break;
    const results = scored.map(g => ach(wk, g.id));
    const anyFail = results.includes('fail');
    const anyPaused = results.includes('paused');
    if (anyFail) break;
    if (anyPaused) { pausedRecently = pausedRecently || n === 0; continue; }  // hold, don't increment
    n++;
  }
  return { n, paused: pausedRecently };
}

/* ══════════════════════════════════════════════════════
   WEEK VIEW
   ══════════════════════════════════════════════════════ */
function renderWeek() {
  document.getElementById('wkNum').textContent = 'W' + wkNum(TODAY);
  document.getElementById('wkDates').textContent = fmtRange(weekStart(TODAY));

  const ws = weekStart(TODAY);
  const aw = awayArr(NOW_WK);

  const dr = document.getElementById('dayRow');
  dr.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(ws); d.setDate(d.getDate() + i);
    dr.innerHTML += `<div class="day-cell ${i===TODAY_I?'today':''} ${aw[i]?'away':''}">
      <div class="dn">${DAYS[i][0]}</div><div class="dd">${d.getDate()}</div></div>`;
  }

  const at = document.getElementById('awayToggles');
  at.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    at.innerHTML += `<button class="away-tog ${aw[i]?'on':''}" onclick="toggleAway(${i})" aria-label="Away ${DAYS[i]}">${DAYS[i][0]}</button>`;
  }

  const wrap = document.getElementById('catBlocks');
  wrap.innerHTML = '';

  CATS.forEach(cat => {
    const sec = document.createElement('div');
    sec.className = 'cat-section';
    const st = streak(cat.id);
    let pill = '';
    if (cat.streak && st.n > 0) pill = `<span class="streak-pill">🔥 ${st.n}w</span>`;
    else if (cat.streak && st.paused) pill = `<span class="streak-pill paused">⏸ held</span>`;

    sec.innerHTML = `<div class="cat-header">
      <span style="font-size:15px">${cat.icon}</span>
      <span class="cat-title" style="color:${cat.color}">${cat.name}</span>${pill}</div>`;

    cat.goals.forEach(g => sec.appendChild(goalCard(g, cat)));
    wrap.appendChild(sec);
  });
}

function goalCard(g, cat) {
  const wk = NOW_WK;
  const l = log(wk, g.id), q = qty(wk, g.id), aw = awayArr(wk);
  const d = days(wk, g.id);
  const qs = qtySum(wk, g.id);
  const [have, goal, unitLbl] = prog(wk, g.id);
  const a = achLive(wk, g.id);
  const hasNote = getNote(wk, g.id).trim().length > 0;
  const scored = isScored(g);
  const byQty = g.target === 'quantity';

  const card = document.createElement('div');
  card.className = 'goal-card' + (scored ? '' : ' unscored');
  card.style.borderLeftColor = cat.color;

  let badge = '';
  if (!scored) badge = `<span class="ach-badge ach-skip">observed</span>`;
  else if (goal === 0) badge = `<span class="ach-badge ach-skip">no target</span>`;
  else if (a === 'exceed') badge = `<span class="ach-badge ach-exceed">⭐ exceeded</span>`;
  else if (a === 'met') badge = `<span class="ach-badge ach-met">✓ reached</span>`;

  let sub;
  if (!scored) sub = `${fmtQty(qs, g.unit)} this week`;
  else if (goal === 0) sub = 'Not targeted this week';
  else if (byQty) sub = `${fmtQty(have, g.unit)} of ${fmtQty(goal, g.unit)} · ${d} ${d===1?'day':'days'}`;
  else sub = `${have} of ${goal} days` + (have > goal ? ` · +${have-goal}` : '');

  const headline = g.type === 'tick' ? d
    : g.type === 'detail' ? d
    : byQty ? fmtQty(qs, g.unit)
    : fmtQty(qs, g.unit);

  card.innerHTML = `
    <div class="goal-head">
      <div class="goal-left">
        <span class="goal-icon">${g.icon}</span>
        <div style="min-width:0">
          <div class="goal-name">${g.name} ${badge}</div>
          <div class="goal-sub">${sub}</div>
        </div>
      </div>
      <div class="goal-right">
        <span class="goal-count">${headline}</span>
        <button class="icon-btn ${hasNote?'active':''}" onclick="noteModal('${g.id}','${wk}')" aria-label="Notes">📝</button>
      </div>
    </div>`;

  card.appendChild(dotRow(g, wk, TODAY_I, aw));

  if (scored && goal > 0) {
    const pct = Math.min(100, Math.round(have / goal * 100));
    const col = have > goal ? 'var(--star)' : have >= goal ? 'var(--green)' : cat.color;
    const remain = byQty ? fmtQty(Math.max(0, goal-have), g.unit) : (goal - have);
    const lbl = have >= goal ? '✓ reached' : `${remain} to go`;
    const bar = document.createElement('div');
    bar.className = 'prog-row';
    bar.innerHTML = `<div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${col}"></div></div>
      <span class="prog-lbl">${lbl}</span>`;
    card.appendChild(bar);
  }

  // secondary line
  if (g.type === 'detail') {
    const line = document.createElement('div');
    line.className = 'qty-line';
    line.innerHTML = `<span>Volume this week</span><b>${weekVolume(wk).toLocaleString('en-GB')} kg</b>`;
    card.appendChild(line);
  } else if (g.type === 'cardio') {
    const line = document.createElement('div');
    line.className = 'qty-line';
    line.innerHTML = `<span>Distance this week</span><b>${fmtQty(cardioKm(wk), 'km')}</b>`;
    card.appendChild(line);
  } else if (g.type === 'quantity') {
    const line = document.createElement('div');
    line.className = 'qty-line';
    line.innerHTML = `<span>${g.unit[0].toUpperCase()+g.unit.slice(1)} this week</span><b>${fmtQty(qs,g.unit)}</b>`;
    card.appendChild(line);
  }

  if (g.book && S.books.current) {
    const bl = document.createElement('div');
    bl.className = 'qty-line';
    bl.innerHTML = `<span>📖 ${esc(S.books.current.title)}</span>
      <button class="icon-btn" style="font-size:10px;font-weight:700;color:var(--honey)" onclick="openBooks()">Manage</button>`;
    card.appendChild(bl);
  }

  return card;
}

/* Shared dot row builder — used by week view, review and history edit */
function dotRow(g, wk, maxDay, aw) {
  const l = log(wk, g.id), q = qty(wk, g.id);
  const dots = document.createElement('div');
  dots.className = 'dots';
  dots.innerHTML = dotRowHTML(g, wk, maxDay, aw);
  return dots;
}

function dotRowHTML(g, wk, maxDay, aw) {
  const l = log(wk, g.id), q = qty(wk, g.id);
  let h = '';
  for (let i = 0; i < 7; i++) {
    const fut = maxDay !== null && i > maxDay;
    const v = q[i] || 0;
    let cls = 'dot', inner = '<span class="pip"></span>';

    if (g.type === 'cardio') {
      const c = cardioDay(wk, i);
      cls += ' cardio' + (c ? ' has' : '');
      if (c) inner = `<span style="font-size:11px">${CK(c.kind).icon}</span>`;
    } else if (g.type === 'quantity') {
      cls += ' qty' + (v > 0 ? ' has' : '');
      if (v > 0) inner = `<span>${fmtQty(v, g.unit)}</span>`;
    } else if (g.type === 'hours') {
      cls += ' hours' + (v > 0 ? ' has' : '');
      if (v > 0) inner = `<span>${v}</span>`;
    } else if (g.type === 'detail') {
      if (l[i]) { cls += ' done'; inner = '<span class="pip"></span>'; }
    } else if (l[i]) cls += ' done';

    if (aw && aw[i]) cls += ' away-d';
    if (maxDay !== null && i === maxDay) cls += ' today-d';
    if (fut) cls += ' future';

    const handler = fut ? '' :
      g.type === 'cardio'   ? `openCardio('${wk}',${i})` :
      g.type === 'detail'   ? `openSession('${wk}',${i})` :
      (g.type === 'quantity' || g.type === 'hours') ? `openQP('${g.id}',${i},'${wk}')` :
      `tickAny('${wk}','${g.id}',${i})`;

    h += `<div class="dot-wrap"><span class="dot-lbl">${DAYS[i][0]}</span>
      <button class="${cls}" ${fut?'disabled':''} onclick="${handler}" aria-label="${g.name} ${DAYS[i]}">${inner}</button></div>`;
  }
  return h;
}

function fmtQty(v, unit) {
  if (unit === 'hours') return (Math.round(v*10)/10) + 'h';
  if (unit === 'minutes') return Math.round(v) + 'm';
  if (unit === 'km') return (Math.round(v*10)/10) + 'km';
  return String(Math.round(v*10)/10);
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function tickAny(wk, id, i) {
  const l = log(wk, id);
  l[i] = l[i] ? 0 : 1;
  save(); refresh();
  if (l[i]) toast('Logged');
}
function tick(id, i, wk) { tickAny(wk, id, i); }
function toggleAway(i) {
  const a = awayArr(NOW_WK);
  a[i] = a[i] ? 0 : 1;
  save(); refresh();
  toast(a[i] ? 'Marked away' : 'Away removed');
}

/* ══════════════════════════════════════════════════════
   QUANTITY PICKER
   ══════════════════════════════════════════════════════ */
let QP = { id:null, i:0, wk:null, val:0 };

function openQP(id, i, wk) {
  const g = G(id);
  QP = { id, i, wk, val: qty(wk, id)[i] || 0 };
  const ws = weekStart(keyToDate(wk));
  const d = new Date(ws); d.setDate(d.getDate() + i);
  document.getElementById('qpTitle').textContent = g.name;
  document.getElementById('qpSub').textContent = `${DAYS[i]} ${d.getDate()} ${MON[d.getMonth()]}`;
  document.getElementById('qpUnit').textContent = g.unit;
  const chips = document.getElementById('qpChips');
  chips.innerHTML = (PRESETS[g.unit] || [1,2,3,4])
    .map(v => `<button class="qp-chip" onclick="qpAdd(${v})">+${fmtQty(v, g.unit)}</button>`).join('');
  qpPaint();
  document.getElementById('qpOverlay').classList.add('open');
}
function qpPaint() {
  const g = G(QP.id);
  document.getElementById('qpVal').textContent = g.unit === 'hours' ? (Math.round(QP.val*10)/10) : Math.round(QP.val*10)/10;
}
function qpAdd(v) { QP.val = Math.round((QP.val + v) * 100) / 100; qpPaint(); }
function qpStep(dir) {
  const g = G(QP.id);
  QP.val = Math.max(0, Math.round((QP.val + dir * (STEP[g.unit] || 1)) * 100) / 100);
  qpPaint();
}
function qpClear() { QP.val = 0; qpPaint(); }
function qpSave() {
  const q = qty(QP.wk, QP.id);
  q[QP.i] = QP.val;
  const l = log(QP.wk, QP.id);
  l[QP.i] = QP.val > 0 ? 1 : 0;
  save();
  document.getElementById('qpOverlay').classList.remove('open');
  refresh();
  toast(QP.val > 0 ? 'Saved' : 'Cleared');
}
document.getElementById('qpOverlay').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});

/* ══════════════════════════════════════════════════════
   MODAL SHELL
   ══════════════════════════════════════════════════════ */
function openModal(html) {
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

/* ══════════════════════════════════════════════════════
   CARDIO
   ══════════════════════════════════════════════════════ */
let CD = { wk:null, i:0, kind:null, km:0, level:null };

function openCardio(wk, i) {
  const ex = cardioDay(wk, i);
  CD = ex
    ? { wk, i, kind: ex.kind, km: +ex.km || 0, level: ex.level ?? null }
    : { wk, i, kind: null, km: 0, level: null };
  paintCardio();
  document.getElementById('modal').classList.add('open');
}

function paintCardio() {
  const ws = weekStart(keyToDate(CD.wk));
  const d = new Date(ws); d.setDate(d.getDate() + CD.i);
  const existing = cardioDay(CD.wk, CD.i);
  const kind = CD.kind ? CK(CD.kind) : null;
  const needsLevel = kind && kind.level;

  let h = `<div class="modal-title">🏃 <span>Cardio</span></div>
    <div class="modal-sub">${DAYS[CD.i]} ${d.getDate()} ${MON[d.getMonth()]}</div>

    <label>What did you do</label>
    <div class="pick-grid">
      ${CARDIO_KINDS.map(k => `<button class="pick ${CD.kind===k.id?'on':''}" onclick="cdKind('${k.id}')">
        <span class="pick-ic">${k.icon}</span><span>${k.name}</span></button>`).join('')}
    </div>

    <label>Distance</label>
    <div class="qp-val" style="font-size:34px;margin-bottom:2px">${CD.km.toFixed(1)}</div>
    <div class="qp-unit" style="margin-bottom:12px">km</div>
    <div class="qp-chips" style="margin-bottom:12px">
      ${[0.5,1,2,5].map(v => `<button class="qp-chip" onclick="cdAdd(${v})">+${v}</button>`).join('')}
    </div>
    <div class="qp-step" style="margin-bottom:${needsLevel ? '18px' : '4px'}">
      <button class="qp-sbtn" onclick="cdAdd(-0.5)">−</button>
      <button class="qp-sbtn" onclick="cdAdd(0.5)">+</button>
    </div>`;

  if (needsLevel) {
    h += `<label>${kind.name} level</label>
      <div style="display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:4px">
        <button class="qp-sbtn" onclick="cdLevel(-1)">−</button>
        <div style="font-family:'Playfair Display',serif;font-size:32px;color:var(--honey);min-width:52px;text-align:center">
          ${CD.level ?? '—'}
        </div>
        <button class="qp-sbtn" onclick="cdLevel(1)">+</button>
      </div>
      <p style="font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px">1 to 20</p>`;
  }

  h += `<div class="btn-row">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-honey" onclick="saveCardio()">Save</button>
    </div>`;

  if (existing) h += `<button class="btn-danger" style="width:100%;margin-top:10px" onclick="clearCardio()">Remove this session</button>`;

  document.getElementById('modalBody').innerHTML = h;
}

function cdKind(k) {
  CD.kind = k;
  const kind = CK(k);
  if (!kind.level) CD.level = null;
  else if (CD.level === null) CD.level = 8;
  paintCardio();
}
function cdLevel(d) {
  CD.level = Math.max(1, Math.min(20, (CD.level ?? 8) + d));
  paintCardio();
}
function cdAdd(v) {
  CD.km = Math.max(0, Math.round((CD.km + v) * 10) / 10);
  paintCardio();
}
function saveCardio() {
  if (!CD.kind) { toast('Pick what you did'); return; }
  if (!CD.km)   { toast('Add a distance'); return; }
  const entry = { kind: CD.kind, km: CD.km };
  if (CK(CD.kind).level) entry.level = CD.level ?? 8;
  setCardio(CD.wk, CD.i, entry);
  closeModal(); refresh();
  toast(`${CK(CD.kind).name} · ${CD.km} km`);
}
function clearCardio() {
  setCardio(CD.wk, CD.i, null);
  closeModal(); refresh();
  toast('Session removed');
}

/* ══════════════════════════════════════════════════════
   STRENGTH SESSION — saves on every edit
   ══════════════════════════════════════════════════════ */
let SESS = { wk:null, i:0, exs:[] };

function openSession(wk, i) {
  SESS = { wk, i, exs: JSON.parse(JSON.stringify(sessions(wk, i))) };
  paintSession();
  document.getElementById('modal').classList.add('open');
}

/* Write straight through to storage — nothing is lost mid-workout */
function persist(quiet) {
  const clean = SESS.exs.filter(e => e.name);
  S.sessions[SESS.wk] = S.sessions[SESS.wk] || {};
  S.sessions[SESS.wk][SESS.i] = JSON.parse(JSON.stringify(clean));
  clean.forEach(e => {
    if (e.sets.some(s => s.reps || s.kg)) S.lastEx[e.name] = JSON.parse(JSON.stringify(e.sets));
  });
  log(SESS.wk, 'strength')[SESS.i] = clean.length ? 1 : 0;
  save();
  if (!quiet) flashSaved();
}

function flashSaved() {
  const el = document.getElementById('saveFlag');
  if (!el) return;
  el.textContent = '✓ saved';
  el.style.opacity = '1';
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(() => { el.style.opacity = '0.45'; el.textContent = 'saves as you go'; }, 1400);
}

/* Last session's numbers for an exercise, used as greyed-out hints */
function hintFor(name, si) {
  const prev = S.lastEx[name];
  if (!prev || !prev[si]) return { reps:'', kg:'' };
  return { reps: prev[si].reps ?? '', kg: prev[si].kg ?? '' };
}
function hintLine(name) {
  const prev = S.lastEx[name];
  if (!prev || !prev.length) return '';
  const parts = prev.filter(s => s.reps || s.kg).map(s => `${s.reps ?? '?'}×${s.kg ?? '?'}`);
  if (!parts.length) return '';
  return parts.slice(0, 5).join('  ');
}

function paintSession() {
  const ws = weekStart(keyToDate(SESS.wk));
  const d = new Date(ws); d.setDate(d.getDate() + SESS.i);
  const vol = Math.round(sessionVolume(SESS.exs));

  let html = `<div class="modal-title">🏋️ <span>Strength</span></div>
    <div class="modal-sub" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span>${DAYS[SESS.i]} ${d.getDate()} ${MON[d.getMonth()]} · ${vol.toLocaleString('en-GB')} kg</span>
      <span id="saveFlag" style="color:var(--green);font-weight:700;opacity:0.45;transition:opacity 0.3s">saves as you go</span>
    </div>`;

  html += `<div class="tpl-row">
    ${S.templates.map(t => `<button class="tpl-chip" onclick="loadTemplate('${t.id}')">${esc(t.name)}</button>`).join('')}
  </div>`;

  if (!SESS.exs.length) {
    html += `<div class="empty" style="padding:26px 10px">
      <div class="empty-ic">🏋️</div>
      <p>Pick your session above, or add an exercise.</p></div>`;
  }

  SESS.exs.forEach((ex, ei) => {
    const evol = Math.round(ex.sets.reduce((s,x) => s + setVolume(x), 0));
    const last = hintLine(ex.name);
    html += `<div class="ex-block">
      <div class="ex-head">
        <div style="flex:1;min-width:0">
          <div class="ex-name">${esc(ex.name)}</div>
          ${last ? `<div class="ex-last">last: ${esc(last)}</div>` : ''}
        </div>
        <span class="ex-vol">${evol ? evol.toLocaleString('en-GB') + ' kg' : ''}</span>
        <button class="set-del" onclick="delEx(${ei})" aria-label="Remove exercise">✕</button>
      </div>
      <div class="set-hdr"><span>#</span><span>Reps</span><span>Kg</span><span></span></div>`;
    ex.sets.forEach((st, si) => {
      const filled = st.reps || st.kg;
      const hint = hintFor(ex.name, si);
      html += `<div class="set-row">
        <span class="set-n" style="${filled?'color:var(--green)':''}">${filled ? '✓' : si+1}</span>
        <input class="set-in" type="text" inputmode="numeric" value="${esc(st.reps ?? '')}"
          placeholder="${esc(hint.reps)}" onchange="setVal(${ei},${si},'reps',this.value)">
        <input class="set-in" type="text" value="${esc(st.kg ?? '')}"
          placeholder="${esc(hint.kg)}" onchange="setVal(${ei},${si},'kg',this.value)">
        <button class="set-del" onclick="delSet(${ei},${si})" aria-label="Remove set">✕</button>
      </div>`;
    });
    html += `<button class="mini-btn" style="margin-top:6px" onclick="addSet(${ei})">+ Add set</button></div>`;
  });

  html += `<button class="mini-btn" onclick="addEx()">+ Add exercise</button>
    <div class="btn-row">
      <button class="btn-honey" onclick="closeModal();refresh()">Done</button>
    </div>
    <p style="font-size:10px;color:var(--muted);margin-top:10px;line-height:1.6">
      Every set saves the moment you enter it, so you can log as you train.
      Greyed numbers are what you did last time — type over them.<br>
      Kg takes <b style="color:var(--text)">BW</b> or <b style="color:var(--text)">BW+20</b>${S.bodyweight ? ` (yours: ${S.bodyweight} kg)` : ` — <span style="color:var(--honey)">set yours under More → Workout templates</span>`}.
      Put an <b style="color:var(--text)">s</b> after a hold, like 30s, to keep it out of the volume total.
    </p>`;

  if (sessions(SESS.wk, SESS.i).length || log(SESS.wk,'strength')[SESS.i]) {
    html += `<button class="btn-danger" style="width:100%;margin-top:6px" onclick="clearSession()">Clear this day</button>`;
  }

  document.getElementById('modalBody').innerHTML = html;
}

function setVal(ei, si, field, v) {
  SESS.exs[ei].sets[si][field] = String(v).trim() === '' ? null : String(v).trim();
  persist();
  paintSession();
}
function addSet(ei) {
  SESS.exs[ei].sets.push({ reps: null, kg: null });
  persist(true); paintSession();
}
function delSet(ei, si) { SESS.exs[ei].sets.splice(si,1); persist(true); paintSession(); }
function delEx(ei) { SESS.exs.splice(ei,1); persist(true); paintSession(); }
function addEx() {
  const name = prompt('Exercise name');
  if (!name || !name.trim()) return;
  SESS.exs.push({ name: name.trim(), sets: [{reps:null,kg:null}] });
  persist(true); paintSession();
}

/* Template tap starts the session fresh — nothing to delete */
function loadTemplate(tid) {
  const t = S.templates.find(x => x.id === tid);
  if (!t) return;
  const hasEntries = SESS.exs.some(e => e.sets.some(s => s.reps || s.kg));
  if (hasEntries && !confirm(`Start a fresh ${t.name} session?\n\nThis clears what you have entered for this day.`)) return;
  SESS.exs = t.exercises.map(n => ({ name: n, sets: [{reps:null,kg:null}] }));
  persist(true); paintSession();
  toast(t.name + ' ready');
}
function clearSession() {
  if (!confirm('Clear this training day?')) return;
  if (S.sessions[SESS.wk]) delete S.sessions[SESS.wk][SESS.i];
  log(SESS.wk,'strength')[SESS.i] = 0;
  save(); closeModal(); refresh();
  toast('Day cleared');
}

function openBooks() {
  const cur = S.books.current;
  let html = `<div class="modal-title">📚 <span>Books</span></div>
    <div class="modal-sub">${S.books.finished.length} finished in ${TODAY.getFullYear()}</div>`;

  if (cur) {
    html += `<label>Currently reading</label>
      <div class="book-item current">
        <span style="font-size:18px">📖</span>
        <div style="flex:1;min-width:0">
          <div class="book-t">${esc(cur.title)}</div>
          <div class="book-m">Started ${new Date(cur.started).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div>
        </div>
      </div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn-ghost" onclick="dropBook()">Remove</button>
        <button class="btn-honey" onclick="finishBook()">Mark finished</button>
      </div>`;
  } else {
    html += `<label>Start a book</label>
      <input id="bookIn" placeholder="Title" />
      <div class="btn-row"><button class="btn-honey" onclick="startBook()">Start reading</button></div>`;
  }

  if (S.books.finished.length) {
    html += `<label style="margin-top:22px">Finished</label>`;
    S.books.finished.slice().reverse().forEach(b => {

        <span style="font-size:16px">✅</span>
        <div style="flex:1;min-width:0">
          <div class="book-t">${esc(b.title)}</div>
          <div class="book-m">Finished ${new Date(b.finished).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>

  html += `<div class="btn-row"><button class="btn-ghost" style="flex:1" onclick="closeModal()">Close</button></div>`;

}
function startBook() {
  const t = document.getElementById('bookIn').value.trim();
  if (!t) return;
  S.books.current = { title: t, started: new Date().toISOString() };
  save(); openBooks(); refresh(); toast('Book started');
}
function finishBook() {
  if (!S.books.current) return;
  S.books.finished.push({ ...S.books.current, finished: new Date().toISOString() });
  S.books.current = null;
  save(); openBooks(); refresh(); toast('Book finished 🎉');
}
function dropBook() {
  if (!confirm('Remove without marking finished?')) return;
  S.books.current = null; save(); openBooks(); refresh();
}

let editTpl = null;

function openTemplates() {
  let html = `<div class="modal-title">🏋️ <span>Workout templates</span></div>
    <div class="modal-sub">Preset exercise lists so logging is edit, not type</div>
    <label>Your bodyweight (kg)</label>
    <input id="bwIn" type="number" step="0.5" value="${S.bodyweight ?? ''}" placeholder="e.g. 78"

    <p style="font-size:10.5px;color:var(--muted);margin-top:7px;line-height:1.6">
      Turns <b style="color:var(--text)">BW</b> into a real number for pull-ups and dips, so their volume counts.
    </p>
    <label style="margin-top:20px">Templates</label>`;

  S.templates.forEach(t => {
    const open = editTpl === t.id;
    html += `<div class="ex-block">
      <div class="ex-head">
        <div style="flex:1;min-width:0">
          <div class="ex-name">${esc(t.name)}</div>
          <div class="ex-last">${t.exercises.length} exercises</div>
        </div>
        <button class="pw-edit ${open?'on':''}" onclick="toggleTpl('${t.id}')">${open ? '✓ Done' : '✏️ Edit'}</button>
        <button class="set-del" onclick="delTemplate('${t.id}')" aria-label="Delete template">✕</button>
      </div>`;

    if (open) {
      html += `<label style="margin-top:10px">Name</label>
        <input value="${esc(t.name)}" onchange="renameTpl('${t.id}',this.value)">
        <label>Exercises</label>`;
      t.exercises.forEach((ex, i) => {
        html += `<div class="tpl-ex-row">
          <div class="tpl-ex-move">
            <button class="tpl-arrow" ${i===0?'disabled':''} onclick="moveEx('${t.id}',${i},-1)" aria-label="Move up">▲</button>
            <button class="tpl-arrow" ${i===t.exercises.length-1?'disabled':''} onclick="moveEx('${t.id}',${i},1)" aria-label="Move down">▼</button>
          </div>
          <input class="set-in" style="text-align:left" value="${esc(ex)}" onchange="renameEx('${t.id}',${i},this.value)">
          <button class="set-del" onclick="removeEx('${t.id}',${i})" aria-label="Remove">✕</button>
        </div>`;
      });
      html += `<button class="mini-btn" style="margin-top:8px" onclick="addTplEx('${t.id}')">+ Add exercise</button>`;
    } else {
      html += `<div style="font-size:11px;color:var(--muted);line-height:1.7">${t.exercises.map(esc).join(' · ')}</div>`;
    }
    html += `</div>`;

  html += `<label style="margin-top:18px">New template</label>
